   if(act==='sing'&&t>.5&&t<9.55){const strength=singVoice(t);ctx.save();ctx.globalAlpha=strength;ellipse(p.head[0]+10,p.head[1]+7,2.3,2.5+Math.max(0,Math.sin(t*10))*1.8,C.paper);ctx.restore();for(let i=0;i<6;i++){const age=t-.65-i*.48;if(age<0)continue;const u=(age%2.6)/2.6;ctx.save();ctx.globalAlpha=Math.sin(u*Math.PI)*strength*.8;musicalNote(p.head[0]+24+u*82+Math.sin(u*TAU+i)*8,p.head[1]+4-u*85+Math.sin(u*6+i)*6,Math.sin(u*5+i)*.25,.75+u*.45,i%3===0);ctx.restore();}}

   if(act==='ball'){

   }
   if(act==='plane'){
     if(t<3.10){ctx.save();ctx.globalAlpha=ramp(t,0,.6);paper(mix(404,p.rh[0],ramp(t,2.9,3.1)),300,Math.sin(t*8)*.025,.88-ramp(t,1,3.1)*.26,true,true);ctx.restore();}
     else {const o=planeMotion(t,p);plane(o.x,o.y,o.angle,.69,o.bank);}

 }
 function drawArrivals(){arrivals=arrivals.filter(a=>time-a.at<1.65);for(let a of arrivals){const t=time-a.at;if(t<0)continue;const u=ramp(t,0,1.65);if(a.kind==='note'){const n=Math.min(30,Math.floor(loose()/3));paper(mix(386,467,u)+Math.sin(u*TAU*2)*20*(1-u),mix(45,308-n*1.65,u),Math.sin(u*7)*.6*(1-u),.84,true);}else{const p=folderSlot(a.seed);box(p.x,mix(67,p.y,u),p.s);}}}
 function advance(dt){time+=dt*config.pace;const t=time-startTime;
   if(act==='tidy'){if(t>=1.05&&!picked){picked=true;dirty=true;}if(t>=7.65&&!deposited){filed=Math.min(notes,filed+batch);if(destination==='shelf')shelfFiled=Math.min(filed,shelfFiled+batch);deposited=true;filingTrips++;save();}}
   if(act==='idle'&&time>=nextAt){if(greeting){greeting=false;begin('surprise');}else if(notes-filed>=16){begin('tidy');}else{const seq=['sing','walk','drum','read','plane','stretch','ball'];begin(seq[round++%seq.length]);}}
   else if(act!=='idle'&&t>=duration[act]){if(act==='ball')restingBall=true;if(act==='plane')restingPlane=true;if(act==='surprise')begin('wave');else if(pending){const n=pending;pending=null;if(n==='greeting')open();else begin(n==='auto'?'idle':n);}else if(act==='wave'&&interruptedActivity)resumeActivity();else{picker.value='auto';begin('idle');}}
 }
 function draw(){const {w,h,s,ox,oy}=dimensions;ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle=C.bg;ctx.fillRect(0,0,w,h);ctx.translate(ox,oy);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';const t=time-startTime;let p=actionPose(act,t);const transition=time-transitionAt;if(fromPose&&transition<.45)p=blend(fromPose,p,smooth(transition/.45));if(act==='idle'&&gaze.active){p.head[0]+=(gaze.x-400)/100;p.head[1]+=(gaze.y-220)/180;}finishPose(p);currentPose=p;
   drawRoom();drawChair(p.chair);const outside=p.hip[0]<285||p.hip[0]>538;
   if(outside){drawDesk();drawStored();drawLegs(p);drawBody(p);drawArms(p);}else{drawLegs(p);drawBody(p);drawDesk();drawStored();drawArms(p);}drawProps(p,t);drawArrivals();
   const show=act==='wave'&&t>.3&&t<2.9; bubble.textContent='oh, hey.';bubble.style.opacity=show?'1':'0';bubble.style.left=`${(ox+(p.head[0]+33)*s)/w*100}%`;bubble.style.top=`${(oy+(p.head[1]-43)*s)/h*100}%`;
 }
 function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);if(!r.width||!r.height)return;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);const s=Math.min(r.width/800,r.height/480);dimensions={w:r.width,h:r.height,s,ox:(r.width-800*s)/2,oy:(r.height-480*s)/2};draw();}
 on($('.office-note'),'click',()=>add('note'));on($('.office-folder'),'click',()=>add('folder'));
 on($('.office-hello'),'click',greet);
 on(picker,'change',()=>request(picker.value));on(pause,'click',()=>{playing=!playing;lastFrame=0;ui();save();});on(motion,'change',e=>{playing=!e.matches;ui();});
 on(canvas,'pointermove',e=>{const r=canvas.getBoundingClientRect();gaze={x:(e.clientX-r.left-dimensions.ox)/dimensions.s,y:(e.clientY-r.top-dimensions.oy)/dimensions.s,active:true};if(playing)dirty=true;});on(canvas,'pointerleave',()=>{gaze.active=false;if(playing)dirty=true;});
 on(canvas,'click',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-dimensions.ox)/dimensions.s,y=(e.clientY-r.top-dimensions.oy)/dimensions.s;if(currentPose&&Math.hypot(x-currentPose.head[0],y-currentPose.head[1])<70)greet();});

 const resizeObserver=new ResizeObserver(resize),visibilityObserver=new IntersectionObserver(es=>{visible=es[0].isIntersecting;lastFrame=0;});resizeObserver.observe(canvas);visibilityObserver.observe(root);
 function frame(ts){if(!root.isConnected)return;const dt=lastFrame?Math.min((ts-lastFrame)/1000,.04):0;lastFrame=ts;if(playing&&!document.hidden&&visible){advance(dt);dirty=true;}if(dirty){draw();dirty=false;}frameId=requestAnimationFrame(frame);}
 root.noteOffice={setState:(n,f,id=folderId)=>setCounts(n,f,id),addNote:()=>add('note'),addFolder:()=>add('folder'),open,getState:()=>({notes,folders,folderId,filed,loose:loose(),carrying:carried(),activity:act,queued:pending,playing}),destroy(){abort.abort();cancelAnimationFrame(frameId);resizeObserver.disconnect();visibilityObserver.disconnect();}};
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{C.bg=config.background;C.ink=config.ink;root.style.setProperty('--office-bg',C.bg);root.style.setProperty('--office-ink',C.ink);draw();}});tweak.addSlider(config,'limb',{label:'Character line weight',min:7,max:15,step:.5,unit:'px'});tweak.addSlider(config,'desk',{label:'Desk line weight',min:2,max:5,step:.25,unit:'px'});tweak.addSlider(config,'pace',{label:'Animation pace',min:.65,max:1.25,step:.05});}

 if(params.get('review')==='1'){
   const controls=document.createElement('div');controls.className='office-controls';
   controls.innerHTML='<label>Review time <input aria-label="Review time" type="range" min="0" max="18.5" step="0.01" value="0"> <output>0.00 s</output></label>';
   root.appendChild(controls);const slider=controls.querySelector('input'),output=controls.querySelector('output');
   const seek=(name,t)=>{if(!duration[name])return;act=name;playing=false;greeting=false;pending=null;interruptedActivity=null;time=t;startTime=0;fromPose=null;restingBall=false;restingPlane=false;arrivals=[];status.textContent=words[name];picker.value=name==='idle'?'auto':name;slider.max=duration[name];slider.value=t;output.value=t.toFixed(2)+' s';ui();draw();};
