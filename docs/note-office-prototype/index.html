<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Note Office</title>
<style>html,body{margin:0;padding:0;background:#f5f2eb}body{max-width:1000px;margin:auto}button,select{cursor:pointer}</style>
</head><body>
<div id="note-office-room" aria-label="Note Office animated room">
 <header class="office-header"><div class="office-title">Note Office<span aria-hidden="true"></span></div><span class="office-subtitle">a little life between the lines</span></header>
 <div class="office-stage"><canvas role="img" aria-label="A playful stick figure in an office with filing cabinets, shelves, a desk, and papers. He walks, files papers, sings, reads, and plays.">A playful office companion. Use the controls to add papers or choose a routine.</canvas><span class="office-bubble" aria-hidden="true"></span><button type="button" class="office-hello cursor-interaction">Say hello</button></div>
 <div class="office-caption"><span class="office-status" role="status" aria-live="polite">Very busy doing nothing.</span><span class="office-count" aria-live="polite"></span></div>
 <footer class="office-controls"><div class="office-additions"><button type="button" class="office-note cursor-interaction">+ Note</button><button type="button" class="office-folder cursor-interaction">+ Folder</button></div><div class="office-playback"><select class="office-activity cursor-interaction" aria-label="Choose an activity"><option value="auto">Let him do his thing</option><option value="sing">Sing &amp; groove</option><option value="walk">Take a stroll</option><option value="tidy">Put papers away</option><option value="stretch">A big stretch</option><option value="drum">Desk beat</option><option value="read">Read a paper</option><option value="ball">Paper ball</option><option value="plane">Paper plane</option></select><button type="button" class="office-pause cursor-interaction" aria-pressed="false">Pause</button></div></footer>
</div>
<style>
#note-office-room{--office-bg:#f5f2eb;--office-ink:#363932;--office-soft:#75776d;--office-line:#dcd9cf;--office-accent:#bb765b;background:var(--office-bg);color:var(--office-ink);border-radius:16px;overflow:hidden;font:400 13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;width:100%;isolation:isolate;box-sizing:border-box}
#note-office-room *{box-sizing:border-box}
#note-office-room .office-header{padding:23px 100px 0 27px;display:flex;align-items:center;gap:17px;flex-wrap:wrap}
#note-office-room .office-title{font:400 23px/1.2 Georgia,serif;display:flex;align-items:center;gap:10px;white-space:nowrap}
#note-office-room .office-title span{width:6px;height:6px;background:var(--office-accent);border-radius:50%}
#note-office-room .office-subtitle{color:var(--office-soft);font-size:12px}
#note-office-room .office-stage{position:relative;width:100%;aspect-ratio:800/480;min-height:225px}
#note-office-room canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#note-office-room .office-bubble{position:absolute;pointer-events:none;white-space:nowrap;font:italic 15px/1.3 Georgia,serif;opacity:0}
#note-office-room .office-hello{position:absolute;right:22px;bottom:7px;background:transparent!important;border-color:transparent!important;color:var(--office-soft)!important}
#note-office-room .office-caption{padding:0 27px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;min-height:36px;font-size:12px;color:var(--office-soft)}
#note-office-room .office-status{font-style:italic}
#note-office-room .office-count{font-variant-numeric:tabular-nums;white-space:nowrap}
#note-office-room .office-controls{border-top:1px solid var(--office-line);padding:15px 24px 19px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#note-office-room .office-additions,#note-office-room .office-playback{display:flex;gap:7px;align-items:center}
#note-office-room button,#note-office-room select{font:400 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--office-bg);color:var(--office-ink);border:1px solid var(--office-line);border-radius:7px;padding:8px 12px;min-height:35px;box-shadow:none;margin:0}
#note-office-room select{max-width:190px;padding-right:22px}
#note-office-room button:hover,#note-office-room select:hover{background:#ebe7dd;border-color:#c8c6bb}
#note-office-room button:focus-visible,#note-office-room select:focus-visible{outline:2px solid var(--office-accent);outline-offset:3px}
#note-office-room .office-note{background:var(--office-ink);color:#fcfaf4;border-color:var(--office-ink)}
#note-office-room .office-note:hover{background:#505349}
#note-office-room .office-pause{min-width:61px}
#note-office-room[data-embed="true"] .office-header,#note-office-room[data-embed="true"] .office-caption,#note-office-room[data-embed="true"] .office-controls,#note-office-room[data-embed="true"] .office-hello{display:none}
#note-office-room[data-embed="true"]{border-radius:0}
#note-office-room[data-embed="true"] .office-stage{min-height:0}
@media(max-width:480px){#note-office-room .office-header{padding:20px 80px 0 20px;gap:7px}#note-office-room .office-subtitle{width:100%;font-size:11px}#note-office-room .office-controls{padding:13px 17px}#note-office-room .office-playback{flex:1;justify-content:flex-end}#note-office-room .office-caption{padding:0 20px 14px;gap:4px}#note-office-room .office-hello{right:12px;bottom:0}#note-office-room .office-bubble{font-size:13px}}
@media(pointer:coarse){#note-office-room button,#note-office-room select{min-height:44px}}
</style>
<script>
(() => {

 function restore(s){if(valid(s?.modelContent?.notes))notes=s.modelContent.notes;if(valid(s?.modelContent?.folders))folders=s.modelContent.folders;if(typeof s?.modelContent?.folderId==='string')folderId=s.modelContent.folderId.slice(0,200);if(s?.privateContent?.version===2&&valid(s.privateContent.filed))filed=Math.min(notes,s.privateContent.filed);if(valid(s?.privateContent?.shelfFiled))shelfFiled=Math.min(filed,s.privateContent.shelfFiled);if(typeof s?.privateContent?.playing==='boolean')playing=s.privateContent.playing;ui();}
 function begin(name){fromPose=currentPose?clone(currentPose):null;act=name;startTime=time;dirty=true;status.textContent=words[name];if(name==='ball')restingBall=false;if(name==='plane')restingPlane=false;if(name==='tidy'){batch=Math.min(6,notes-filed);picked=false;deposited=false;destination=filingTrips%2&&folders>0?'box':'shelf';}if(name==='idle')nextAt=time+3.1+rand(round+10)*2;}

   for(let k=0;k<2;k++){const f=(phase+k*.5)%1,shift=(.5-f)*59+(f>.6?59*smooth((f-.6)/.4):0),lift=f>.6?Math.sin((f-.6)/.4*Math.PI)*16:0;const foot=[x+dir*shift*amount+(k?6:-6)*(1-amount),ground-lift*amount];p[k?'rf':'lf']=foot;p[k?'rk':'lk']=joint(p.hip,foot,61,62,-dir);}

 function drawArrivals(){arrivals=arrivals.filter(a=>time-a.at<1.65);for(let a of arrivals){const t=time-a.at;if(t<0)continue;const u=ramp(t,0,1.65);if(a.kind==='note'){const n=Math.min(30,Math.floor(loose()/3));paper(mix(386,467,u)+Math.sin(u*TAU*2)*20*(1-u),mix(45,308-n*1.65,u),Math.sin(u*7)*.6*(1-u),.84,true);}else{const p=folderSlot(a.seed);box(p.x,mix(67,p.y,u),p.s);}}}

 on(canvas,'click',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left-dimensions.ox)/dimensions.s,y=(e.clientY-r.top-dimensions.oy)/dimensions.s;if(currentPose&&Math.hypot(x-currentPose.head[0],y-currentPose.head[1])<70)request('wave');});
