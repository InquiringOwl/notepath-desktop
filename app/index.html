<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' notepath:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' notepath:; img-src 'self' data: blob: https: notepath:; media-src 'self' blob: https: notepath:; connect-src 'self' notepath: https://en.wiktionary.org https://en.wikipedia.org https://api.dictionaryapi.dev https://api.mymemory.translated.net; frame-src https://www.youtube-nocookie.com https://player.vimeo.com">
<title>NotePath</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* NotePath base styles, cut from Inquire's style.css (app frame, console windows, menu slots, buttons, desktop chrome). Single dark look; Settings themes rewrite the surface variables. */
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --void:#070A10; --ink:#0B1019; --panel:#111827; --panel-2:#162033; --panel-3:#1B2740;
  --line:#243149; --line-2:#34445F; --text:#DDE4EF; --muted:#8B97AE; --faint:#58647D;
  --amber:#F2B84B; --cyan:#5CC8E0; --pink:#F07CA0; --violet:#B49BFF; --green:#7BD88F; --magenta:#D97AE6; --lime:#B5D65A; --red:#E5675B;
  --g-stem:#5CC8E0; --g-hum:#D97AE6; --g-soc:#B5D65A; /* subject-group colours: STEM cyan (as its Subjects heading), Arts & Humanities magenta, Social Sciences lime */
  --glow:rgba(92,200,224,.35);
  /* theme surfaces (Settings → Appearance rewrites these; defaults = "Capsuleer") */
  --tint-1:rgba(92,200,224,.10); --tint-2:rgba(180,155,255,.08); --chrome-1:#0F1624; --chrome-2:#0A0F18;
  --win-1:rgba(22,32,51,.92); --win-2:rgba(13,19,31,.94); --slot-1:rgba(27,39,64,.85); --slot-2:rgba(14,21,34,.9);
  --slot-h1:rgba(35,55,86,.9); --slot-h2:rgba(14,24,40,.95); --wash:rgba(11,16,25,.7); --sky:#101A2C; --stage-sky:#16203A; --frame:var(--cyan); --blur:0px;
  /* neutral (locked / planned) tree nodes, node orbs and the era bar: settings.js themeVars recomputes these per theme; amber (ready) and green (mastered) never change */
  --node-1:#1C2537; --node-2:#121927; --node-line:#3A475F; --node-line-2:#4A5874; --node-text:#9AA6BC; --orb-1:#3A4A66; --orb-2:#0D1422; --era-1:rgba(28,42,68,.95); --era-2:rgba(16,24,39,.95);
  --math:"STIX Two Text","Noto Sans Symbols","Cambria Math",Cambria,Georgia,serif;
  --sans:"IBM Plex Sans","Noto Sans Symbols",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ui:"Saira Semi Condensed","Arial Narrow","IBM Plex Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--void)}
body{margin:0;color:var(--text);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--frame) 35%,transparent)}

/* ---------- math typography (shared with content) ---------- */
.m{font-family:var(--math);font-style:normal;white-space:nowrap}
.m i,.display i{font-style:italic}
sup{font-size:.68em;vertical-align:.62em;line-height:0}
sub{font-size:.68em;vertical-align:-.25em;line-height:0}
.c1{color:var(--amber)} .c2{color:var(--cyan)} .c3{color:var(--pink)} .c4{color:var(--violet)} .c5{color:var(--green)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.86em;margin:0 .12em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}
.fr>span{display:block}
.mat{display:inline-block;position:relative;vertical-align:middle;padding:0 .38em;margin:0 .2em;line-height:1.25}
.mat::before,.mat::after{content:"";position:absolute;top:.05em;bottom:.05em;width:.28em;border:1.5px solid currentColor}
.mat::before{left:0;border-right:none}.mat::after{right:0;border-left:none}
.mat.det::before,.mat.det::after{width:0;border-top:none;border-bottom:none}
.mat>table{border-collapse:collapse;font-size:.95em}
.mat td{padding:.06em .42em;text-align:center}
.mat.aug td:nth-last-child(2){border-right:1px solid currentColor;padding-right:.55em}
.mat.aug td:last-child{padding-left:.55em}
.mat td.bar{border-right:1px solid currentColor;padding-right:.55em}
.mat td.bar+td{padding-left:.55em}
.display{font:400 18px/1.9 var(--math);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;overflow-x:auto;white-space:nowrap;margin:10px 0}
/* Computer Science: inline code and code blocks in page text (colours c1–c5 work inside) */
code{font:400 .92em/1.4 var(--mono);color:var(--text);background:color-mix(in srgb,var(--frame) 7%,transparent);border:1px solid var(--line);border-radius:3px;padding:0 4px;white-space:pre-wrap}
pre.code{font:400 14px/1.6 var(--mono);color:var(--text);background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:4px;padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:pre}
pre.code code{background:none;border:0;padding:0;font-size:inherit}
pre.code .out{color:var(--pink)}
/* ---------- app frame ---------- */
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);
  background:
   radial-gradient(1200px 600px at 78% -10%, var(--tint-1), transparent 60%),
   radial-gradient(900px 700px at -10% 110%, var(--tint-2), transparent 60%),
   var(--void)}
.topbar{display:flex;align-items:center;gap:16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--chrome-1),var(--chrome-2));min-height:44px;backdrop-filter:blur(var(--blur))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:26px;height:26px;border:1px solid var(--frame);display:grid;place-items:center;font:600 14px/1 var(--math);color:var(--frame);
  clip-path:polygon(0 0,80% 0,100% 20%,100% 100%,20% 100%,0 80%);background:color-mix(in srgb,var(--frame) 8%,transparent)}
.brand-mark{width:30px;height:30px;border:0;clip-path:none;background:none;display:block}
.brand-mark img{display:block;width:30px;height:30px}
.brand-name{font:600 15px/1 var(--ui);letter-spacing:.28em;text-transform:uppercase}
.crumbs{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--muted);cursor:pointer;letter-spacing:inherit;text-transform:inherit}
.crumbs button:hover{color:var(--text)}
.crumbs .sep{color:var(--faint)}
.crumbs .here{color:var(--text)}
.topstat{background:none;border:1px solid transparent;border-radius:2px;padding:5px 8px;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:10px;font:500 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.topstat:hover{border-color:var(--line-2);color:var(--text)}
.topstat:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.topstat.tracked{color:var(--text)}
.stat-star{color:var(--amber);margin-right:6px;letter-spacing:0}
/* screen transition (go() in app.js): the same fade-in as the Settings window */
@keyframes vt-in{from{opacity:0;filter:blur(3px) brightness(.8)}to{opacity:1;filter:none}}
.vt-in{animation:vt-in .45s cubic-bezier(.2,.7,.2,1)}
.meter{width:120px;height:6px;background:var(--panel-3);border:1px solid var(--line);position:relative}
.meter>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--green),#B8F0C4);width:0}
.view{min-height:0;position:relative}

/* EVE window panel */
.win{background:linear-gradient(180deg,var(--win-1),var(--win-2));border:1px solid var(--line);position:relative;backdrop-filter:blur(var(--blur))}
.win::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--frame);border-top:2px solid var(--frame);opacity:.7;pointer-events:none}
.win::after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-right:2px solid var(--frame);border-bottom:2px solid var(--frame);opacity:.35;pointer-events:none}
.win-h{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);
  font:600 12px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.win-h .dot{width:6px;height:6px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.eyebrow{font:500 12px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* ---------- menu screens ---------- */
.screen{height:100%;overflow:auto;padding-inline:16px;padding-block:clamp(24px,6vh,64px) 48px}
.screen-in{max-width:1080px;margin:0 auto;display:grid;gap:28px}
.hello h1{font:400 clamp(34px,5vw,56px)/1.05 var(--math);margin:0;letter-spacing:-.005em;text-wrap:balance}
.hello p{color:var(--muted);max-width:60ch;margin:12px 0 0}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.subj-group .slots{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.slot{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:18px;min-height:112px;
  background:linear-gradient(180deg,var(--slot-1),var(--slot-2));border:1px solid var(--line-2);position:relative;backdrop-filter:blur(var(--blur));transition:border-color .2s,background .2s}
.slot:hover{border-color:var(--frame);background:linear-gradient(180deg,var(--slot-h1),var(--slot-h2))}
.slot:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.slot .glyph{width:56px;height:56px;display:grid;place-items:center;font:400 28px/1 var(--math);color:var(--frame);border:1px solid var(--line-2);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--frame) 25%,transparent),rgba(11,16,25,.8) 70%)}
.slot h3{margin:0;font:600 18px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.slot p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.slot .tag{position:absolute;right:10px;bottom:8px;font:500 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--green)}
.slot.locked{cursor:default;opacity:.5;border-style:dashed}
.slot.locked:hover{border-color:var(--line-2);background:linear-gradient(180deg,var(--slot-1),var(--slot-2))}
.slot.locked .glyph{color:var(--faint)}
.slot.locked .tag{color:var(--faint)}
.slot.big{min-height:150px}

.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--ink);padding:6px 10px}
.search input{all:unset;flex:1;font:13px var(--sans);color:var(--text);min-width:0}
.search input::placeholder{color:var(--faint)}
.search svg{flex:none}
/* buttons */
.btn{font:600 13px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--amber);border:0;border-radius:2px;padding:10px 14px;cursor:pointer;min-width:84px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--frame);color:var(--frame)}
.btn.good{background:var(--green)}
.btn-s{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px;padding:6px 9px;cursor:pointer}
.btn-s:hover{color:var(--text);border-color:var(--frame)}
.btn-s[aria-pressed="true"]{color:var(--ink);background:var(--amber);border-color:var(--amber)}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* ---------- desktop app chrome ---------- */
.desktop .topbar{-webkit-app-region:drag}
.desktop .topbar button,.desktop .topbar input{-webkit-app-region:no-drag}
/* windows over the app sit on top of the top bar's drag strip; Electron still treats the strip as "drag" through them, so a
   window's ✕ (and anything else up there) only clicked at its edges. Overlays opt out, and the strip stops dragging while one is open. */
.desktop .mw-ov,.desktop .set-ov,.desktop .ask-ov,.desktop .nr-panel,.desktop .tm-menu,.desktop .np-pop,.desktop .np-ck{-webkit-app-region:no-drag}
.desktop body.mw-open .topbar,.desktop body.set-open .topbar,.desktop body.ask-open .topbar{-webkit-app-region:no-drag}
.os-darwin .topbar{padding-left:84px}
.verline{display:flex;align-items:center;gap:12px;font:500 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.upd{position:fixed;right:16px;top:calc(56px + env(safe-area-inset-top,0px));z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:min(560px,calc(100% - 32px));
  padding:10px 14px;background:linear-gradient(180deg,var(--panel-3),var(--panel));border:1px solid var(--frame);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 18px var(--glow);font-size:13.5px;color:var(--text)}
.upd .dot{width:7px;height:7px;background:var(--frame);box-shadow:0 0 8px var(--frame);flex:none}
.upd .dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.upd .btn{padding:8px 12px}


/* Settings window (web/src/settings.js) + top-bar gear + theme helpers. */
.gear{background:none;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;width:30px;height:26px;display:grid;place-items:center;border-radius:2px;padding:0;flex:none}
.gear:hover{color:var(--text);border-color:var(--frame)}
.gear svg{width:16px;height:16px}
.topstat+.gear{margin-left:0}

/* the app behind the window fogs and eases back */
#app,.inqi-stage,.inqi-corner{transition:filter .35s ease,transform .35s ease}
body.set-open #app,body.set-open .inqi-stage,body.set-open .inqi-corner,body.ask-open #app,body.mw-open #app{filter:blur(3px) saturate(.75) brightness(.72);transform:scale(.985)}
.set-ov{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(200,220,255,.06),rgba(3,6,11,.55));opacity:0;transition:opacity .3s ease}
body.set-open .set-ov{opacity:1}
.set-win{width:min(880px,100%);height:min(640px,calc(100dvh - 32px));display:flex;flex-direction:column;
  box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),0 0 40px var(--glow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateY(10px) scale(.98);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
body.set-open .set-win{transform:none}
.set-win.is-doc{width:min(760px,100%)}
.set-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.set-h .dot{width:7px;height:7px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.set-h h2{margin:0;font:600 14px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--text)}
.set-x{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;width:30px;height:30px;font-size:15px;border-radius:2px}
.set-x:hover{color:var(--text);border-color:var(--line-2)}
.set-body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.set-win.is-doc .set-body{grid-template-columns:minmax(0,1fr)}
.set-tabs{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-right:1px solid var(--line);background:rgba(0,0,0,.12)}
.set-tab{background:none;border:0;text-align:left;cursor:pointer;padding:9px 12px;font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);position:relative}
.set-tab:hover{color:var(--text);background:rgba(255,255,255,.03)}
.set-tab[aria-selected="true"]{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 18%,transparent),transparent)}
.set-tab[aria-selected="true"]::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;background:var(--frame);box-shadow:0 0 10px var(--frame)}
.set-pane{overflow:auto;padding:18px 22px 24px;outline:none}
.set-pane h3{margin:0 0 4px;font:600 12px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
.set-lede{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:62ch}
.set-lede b{color:var(--text);font-weight:600}
.set-small{font-size:12px;color:var(--faint);margin:16px 0 0}
.set-msg{min-height:20px;margin:12px 0 0;font:500 13px/1.4 var(--sans);color:var(--red)}
.set-msg.ok{color:var(--green)}
.set-row{margin:18px 0 0}

/* theme squares */
.set-thfam{margin:0 0 16px}
.set-thfam>h3{color:var(--muted);margin-bottom:8px}
.set-thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.set-th{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:12px;row-gap:2px;align-items:start;text-align:left;cursor:pointer;
  padding:10px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:3px;transition:border-color .15s,background .15s}
.set-th:hover{border-color:var(--line-2);background:rgba(255,255,255,.03)}
.set-th[aria-checked="true"]{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame),0 0 16px var(--glow)}
.set-sw{grid-row:1/4;width:64px;height:64px;position:relative;display:block;background:var(--p);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.set-sw i{position:absolute;display:block}
.set-swp{inset:0;background:radial-gradient(70% 60% at 85% 0%,color-mix(in srgb,var(--d) 30%,transparent),transparent 70%),radial-gradient(70% 60% at 0% 100%,color-mix(in srgb,var(--t) 22%,transparent),transparent 70%)}
.set-sws{left:12px;top:14px;right:8px;bottom:8px;background:var(--s);border:1px solid color-mix(in srgb,var(--s) 70%,#fff 30%)}
.set-swd{left:12px;top:14px;width:10px;height:10px;border-left:2px solid var(--d);border-top:2px solid var(--d);box-shadow:-2px -2px 8px color-mix(in srgb,var(--d) 60%,transparent)}
.set-swd::after{content:"";position:absolute;left:8px;top:8px;width:30px;height:3px;background:var(--d);opacity:.9}
.set-sw.set-glass .set-swp{background:radial-gradient(80% 70% at 85% 10%,color-mix(in srgb,var(--t) 70%,transparent),transparent 70%),radial-gradient(80% 70% at 10% 95%,color-mix(in srgb,var(--d) 55%,transparent),transparent 70%)}
.set-sw.set-glass .set-sws{background:color-mix(in srgb,var(--s) 45%,transparent);backdrop-filter:blur(6px);border-color:rgba(255,255,255,.35)}
.set-thname{font:600 13px/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--text);margin-top:2px}
.set-thnote{font-size:12px;line-height:1.35;color:var(--muted)}
.set-thchips{display:flex;gap:4px;align-self:end}
.set-thchips i{width:14px;height:14px;border:1px solid rgba(255,255,255,.25)}

/* rows, toggles, segmented control, forms */
.set-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-item p{margin:0;font-size:13px;color:var(--muted)}
.set-item>:last-child{flex:none}
.set-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.set-seg button{background:none;border:0;border-left:1px solid var(--line-2);padding:7px 10px;cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.set-seg button:first-child{border-left:0}
.set-seg button[aria-checked="true"]{background:var(--frame);color:var(--ink)}
.set-tog{position:relative;width:42px;height:22px;cursor:pointer;display:inline-block}
.set-tog input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.set-tog span{position:absolute;inset:0;border:1px solid var(--line-2);border-radius:11px;background:var(--ink);transition:background .2s,border-color .2s}
.set-tog span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.set-tog input:checked+span{background:color-mix(in srgb,var(--frame) 30%,var(--ink));border-color:var(--frame)}
.set-tog input:checked+span::after{transform:translateX(20px);background:var(--frame)}
.set-tog input:focus-visible+span{outline:2px solid var(--frame);outline-offset:2px}
.set-form{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);max-width:420px}
.set-form p{margin:0;font-size:13px;color:var(--muted)}
.set-form label{display:grid;gap:5px;font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.set-form input{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:8px 10px;font:400 14px/1.3 var(--sans);text-transform:none;letter-spacing:0}
.set-form input:focus{outline:none;border-color:var(--frame);box-shadow:0 0 0 1px var(--frame)}
.set-form .btn-s{justify-self:start}
.btn-s.warn{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.btn-s.warn:hover{background:color-mix(in srgb,var(--red) 15%,transparent)}
.btn-s.file{display:inline-block}
a.btn-s{text-decoration:none;display:inline-block}

/* documents (EULA) */
.set-doc{max-width:66ch;font-size:14px;line-height:1.65}
.set-doc h3{margin:18px 0 6px}
.set-doc p{margin:0 0 10px;color:var(--text)}

@media (max-width:700px){
  .set-ov{padding:8px}
  .set-win{height:calc(100dvh - 16px)}
  .set-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .set-tabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .set-tab{white-space:nowrap;padding:8px 10px}
  .set-tab[aria-selected="true"]::before{left:6px;right:6px;top:auto;bottom:0;width:auto;height:2px}
  .set-pane{padding:14px 14px 20px}
  .set-item{flex-wrap:wrap}
  .set-thgrid{grid-template-columns:minmax(0,1fr)}
}

/* Reduce motion (Settings → Display) */
:root[data-reduce-motion] *,:root[data-reduce-motion] *::before,:root[data-reduce-motion] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}

/* top-bar Settings button (word, not an icon) */
.gear{width:auto;height:26px;padding:0 10px;font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}

/* faders (Display → Text size / Interface size) */
.set-faditem{flex-direction:column;align-items:stretch;gap:12px}
.set-faditem>:last-child{flex:initial}
.set-fader{width:min(520px,100%);padding-top:2px}
.set-fadrow{display:flex;align-items:flex-start;gap:8px}
.set-fadrow>.set-fstep,.set-fadrow>.set-fval,.set-fadrow>.set-freset{margin-top:0;align-self:flex-start;height:22px}
.set-fadrow>.set-fval,.set-fadrow>.set-freset{display:grid;place-items:center}
.set-fstep{flex:none;width:24px;height:24px;display:grid;place-items:center;padding:0;background:none;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);cursor:pointer;font:600 14px/1 var(--ui)}
.set-fstep:hover{color:var(--text);border-color:var(--frame)}
.set-fval{flex:none;min-width:44px;text-align:right;font:600 12px/1 var(--mono,var(--ui));color:var(--text);letter-spacing:.04em}
.set-freset{flex:none;background:none;border:0;padding:4px 2px;cursor:pointer;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.set-freset:hover:not(:disabled){color:var(--frame)}
.set-freset:disabled{opacity:.35;cursor:default}
.set-fader input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:8px 0;background:transparent;cursor:pointer}
.set-fader input[type=range]::-webkit-slider-runnable-track{height:4px;border:1px solid var(--line-2);border-radius:0;
  background:linear-gradient(90deg,var(--frame) var(--f),transparent var(--f)),repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--n) - 1px),var(--line-2) calc(100%/var(--n) - 1px) calc(100%/var(--n))),var(--ink);
  box-shadow:0 0 8px color-mix(in srgb,var(--frame) 25%,transparent)}
.set-fader input[type=range]::-moz-range-track{height:4px;border:1px solid var(--line-2);background:var(--ink)}
.set-fader input[type=range]::-moz-range-progress{height:4px;background:var(--frame)}
.set-fader input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;margin-top:-9px;background:var(--panel-3);border:1px solid var(--frame);border-radius:1px;box-shadow:0 0 10px var(--glow),inset 0 0 0 2px var(--ink)}
.set-fader input[type=range]::-moz-range-thumb{width:10px;height:18px;background:var(--panel-3);border:1px solid var(--frame);border-radius:1px;box-shadow:0 0 10px var(--glow)}
.set-fader input[type=range]:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.set-frange{flex:1;min-width:0;display:flex;flex-direction:column}
.set-fmarks{position:relative;height:12px;margin:6px 6px 0}
.set-fmarks span{position:absolute;transform:translateX(-50%);font:500 10px/1 var(--ui);letter-spacing:.06em;color:var(--faint)}

/* Shortcuts */
.set-keys{margin:14px 0 0;display:grid;gap:0}
.set-keys>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.set-keys dt{display:flex;gap:4px;flex-wrap:wrap}
.set-keys dd{margin:0;font-size:13px;color:var(--muted)}
.set-kbd{display:inline-block;min-width:26px;padding:4px 7px;text-align:center;font:600 11px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px}
@media (max-width:700px){ .set-fader{width:100%} .set-keys>div{grid-template-columns:minmax(0,1fr);gap:6px} }

/* Usage: scroll test box */
.set-scrolltry{margin-top:14px;height:120px;overflow:auto;border:1px dashed var(--line-2);border-radius:2px;padding:4px 12px;background:rgba(0,0,0,.15);font-size:13px;color:var(--muted)}
.set-scrolltry p{margin:6px 0}
.set-scrolltry:focus-visible{outline:2px solid var(--frame);outline-offset:2px}

/* Appearance → Note links */
.set-lcitem{align-items:flex-start}
.set-lcdemo{display:block;margin-top:6px;color:var(--text)}
.set-lc{display:flex;flex-wrap:wrap;gap:6px;max-width:230px;justify-content:flex-end}
.set-lcs{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);background:var(--c);cursor:pointer;padding:0;position:relative;overflow:hidden}
.set-lcs[aria-checked="true"]{box-shadow:0 0 0 2px var(--text),0 0 12px var(--c)}
.set-lcs:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.set-lcpick{background:conic-gradient(#F07CA0,#F2B84B,#7BD88F,#5CC8E0,#B49BFF,#F07CA0);display:inline-block}
.set-lcpick input{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:40px;height:40px}

/* Updates in About: Install & Relaunch from Settings (sign-in screen or app) */
.set-upd-btns:empty{display:none}
.set-upd.is-ready h3{color:var(--green)}
.set-upd .btn{padding:8px 12px;white-space:nowrap}
.set-tab.has-upd::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;vertical-align:middle;background:var(--green);box-shadow:0 0 8px var(--green)}

/* small dialog in the same style (askText in app.js: New note title) */
.ask-ov{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;
  background:radial-gradient(ellipse at 50% 40%,rgba(200,220,255,.06),rgba(3,6,11,.55));opacity:0;transition:opacity .25s ease}
body.ask-open .ask-ov{opacity:1}
.ask-ov.out{opacity:0}
.ask-win{width:min(460px,100%);margin:0;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03),0 0 40px var(--glow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateY(10px) scale(.98);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
body.ask-open .ask-win{transform:none}
.ask-body{display:grid;gap:10px;padding:18px 20px 20px}
.ask-l{font:600 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ask-in{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:10px 12px;font:400 16px/1.3 var(--sans);outline:none}
.ask-in:focus{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame)}
.ask-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.ask-btns .btn{padding:9px 14px}
.set-msg.warn{color:var(--amber)}

/* rebindable shortcuts (Shortcuts tab) */
.set-binds{display:grid;border-top:1px solid var(--line)}
.set-bind{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.set-bind h3{margin:0}
.set-bind p{margin:3px 0 0;font-size:12px;color:var(--faint)}
.set-bk{min-width:120px;min-height:32px;display:flex;gap:4px;justify-content:center;align-items:center;padding:4px 8px;cursor:pointer;background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px}
.set-bk:hover,.set-bk:focus-visible{border-color:var(--frame);outline:none}
.set-bk.off .set-kbd{color:var(--faint);border-style:dashed}
.set-bk.rec{border-color:var(--frame);box-shadow:0 0 0 1px var(--frame),0 0 14px var(--glow)}
.set-rec{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);animation:dk-gem 1.2s ease-in-out infinite}
.set-bx{width:30px;height:30px;background:none;border:1px solid transparent;border-radius:2px;color:var(--muted);cursor:pointer;font-size:15px}
.set-bx:hover:not(:disabled){color:var(--text);border-color:var(--line-2)}
.set-bx:disabled{opacity:.25;cursor:default}
.set-fixh{margin:26px 0 0!important}

/* Your colours + presets (Appearance) */
.set-cl{margin:0 0 12px;font-size:13px;color:var(--muted);max-width:66ch}
.set-cl b{color:var(--text);font-weight:600}
.set-cedit{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start;padding:14px;border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:3px}
.set-cprev .set-sw{width:96px;height:96px}
.set-cfields{display:grid;gap:8px}
.set-cf{display:grid;grid-template-columns:150px 40px 96px;gap:10px;align-items:center}
.set-cfl{font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text);display:flex;flex-direction:column;gap:3px}
.set-cfl small,.set-cglass small{font:400 12px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--faint)}
.set-cpick{width:40px;height:30px;border-radius:3px;border:1px solid var(--line-2);background:var(--c);position:relative;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.set-cpick:hover,.set-cpick:focus-within{border-color:var(--frame)}
.set-cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.set-hex{width:96px;box-sizing:border-box;padding:6px 8px;font:500 12.5px/1 var(--mono);letter-spacing:.06em;color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:2px}
.set-hex:focus{outline:none;border-color:var(--frame)}
.set-hex.bad{border-color:var(--red)}
.set-cglass{display:flex;align-items:center;gap:8px;font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-top:4px;cursor:pointer}
.set-cglass input{accent-color:var(--frame)}
.set-csave{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0}
.set-cname{flex:1 1 180px;max-width:240px;padding:7px 10px;font:400 13px/1.2 var(--sans);color:var(--text);background:var(--ink);border:1px solid var(--line-2);border-radius:2px}
.set-cname:focus{outline:none;border-color:var(--frame)}
.set-cto{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-left:4px}
.set-csave .set-msg{flex-basis:100%;margin:2px 0 0;min-height:0}
.set-presets{grid-template-columns:repeat(3,minmax(0,1fr))}
.set-pwrap{position:relative;display:grid}
.set-pwrap>.set-th{width:100%}
.set-pwrap>button.set-th{padding-right:36px}
.set-pempty{cursor:default;border-style:dashed;background:transparent}
.set-pempty:hover{border-color:var(--line);background:transparent}
.set-swempty{display:grid!important;place-items:center;background:transparent!important;border-style:dashed!important;font:600 20px/1 var(--ui);color:var(--faint)}
.set-pdel{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:2px;color:var(--muted);cursor:pointer;font:600 11px/1 var(--ui);letter-spacing:.08em}
.set-pdel:hover,.set-pdel.armed{color:var(--red);border-color:var(--red)}
@media (max-width:900px){ .set-presets{grid-template-columns:minmax(0,1fr)} }
@media (max-width:700px){ .set-cedit{grid-template-columns:minmax(0,1fr)} .set-cf{grid-template-columns:minmax(0,1fr) 40px 96px} }

/* New note: which kind (NotePath) */
.ask-win:has(.ask-kinds){width:min(560px,100%)}
.ask-kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.ask-kind{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:12px;border:1px solid var(--line-2);border-radius:3px;background:rgba(0,0,0,.18);color:var(--muted);text-align:left}
.ask-kind b{font:600 13px/1.2 var(--sans);color:var(--text)}
.ask-kind small{font:400 11.5px/1.35 var(--sans)}
.ask-kg{font:600 20px/1 var(--math);color:var(--frame)}
.ask-kind:hover{border-color:color-mix(in srgb,var(--frame) 60%,var(--line-2))}
.ask-kind[aria-checked="true"]{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 14%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--frame) 30%,transparent)}
.ask-kind:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
@media (max-width:520px){ .ask-kinds{grid-template-columns:minmax(0,1fr)} .ask-kind{flex-direction:row;flex-wrap:wrap;align-items:center} .ask-kind small{flex-basis:100%} }

/* Menu notes strip (.mnotes), My notes (.nb), rich editor, toolbar, widgets, picker, right-click menu, toast, windows over the app (.mw-*). Cut from Inquire's menu.css (display box, Assist dock and Achievements removed). */
/* ---- notes on the menu ---- */
.mnotes{border:1px solid var(--line);background:linear-gradient(180deg,var(--slot-1),var(--slot-2));padding:14px 16px}
.mnotes-h{display:flex;align-items:center;gap:10px;margin:-14px -16px 12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);transition:background .15s}
.mnotes-h:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 12%,transparent),transparent)}
.mnotes-h:hover h2{color:var(--frame)}
.mnotes-h:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.mnotes-go{margin-right:auto;font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);transition:color .15s}
.mnotes-h:hover .mnotes-go{color:var(--frame)}
.mnotes-new{font:600 13px/1 var(--ui);letter-spacing:.16em;padding:10px 16px;color:var(--text);border-color:color-mix(in srgb,var(--frame) 55%,var(--line-2));background:color-mix(in srgb,var(--frame) 12%,var(--panel-2))}
.mnotes-new:hover{color:var(--ink);background:var(--frame);border-color:var(--frame);box-shadow:0 0 16px color-mix(in srgb,var(--frame) 45%,transparent)}
.mnotes-h h2{margin:0;font:600 15px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase}
.mnotes-h .num{color:var(--faint);font:500 12px/1 var(--mono)}
.mnotes-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mnote{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px 14px;min-height:96px;border:1px solid var(--line);border-left:3px solid var(--frame);background:rgba(0,0,0,.18)}
.mnote:hover{border-color:var(--line-2);border-left-color:var(--frame);background:rgba(255,255,255,.03)}
.mnote:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.mnote-t{font:600 14px/1.3 var(--sans);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnote-b{font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.mnote-m{margin-top:auto;font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.mnotes-empty{margin:0;color:var(--muted);font-size:13.5px;grid-column:1/-1}

/* ---- Notes screen ---- */
.nb{--nb-fw:200px;--nb-lw:var(--nb-lw-user,270px);display:grid;grid-template-columns:var(--nb-fw) var(--nb-lw) minmax(0,1fr);height:clamp(460px,68vh,780px);position:relative;transition:grid-template-columns .32s cubic-bezier(.2,.7,.2,1)}
.nb-list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.nb-tools{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.nb-tools .search{flex:1;min-width:0}
.nb-tools input{all:unset;flex:1;min-width:0;font-size:13.5px;color:var(--text)}
.nb-items{overflow:auto;flex:1}
.nb-it{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);position:relative}
.nb-it:hover{background:rgba(255,255,255,.03)}
.nb-it[aria-selected="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 16%,transparent),transparent)}
.nb-it[aria-selected="true"]::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-it:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-t{font:600 14px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-m{font:500 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.nb-empty,.nb-none p{color:var(--muted);padding:14px;margin:0}
.nb-ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.nb-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nb-saved{margin-right:auto;font:500 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nb-title{all:unset;box-sizing:border-box;padding:14px 18px 6px;font:400 26px/1.2 var(--math);color:var(--text)}
.nb-host{flex:1;min-height:0;display:flex;flex-direction:column}
.nb-title:focus-visible{box-shadow:inset 2px 0 0 var(--frame)}

/* ---------- notes: folders, list extras, editor bar, rich editor ---------- */
.nb-folders{display:flex;flex-direction:column;gap:1px;padding:10px 8px;border-right:1px solid var(--line);overflow:auto;background:rgba(0,0,0,.12);min-height:0}
.nb-fh{font:600 10px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:10px 8px 6px}
.nb-fd{display:flex;align-items:center;border-radius:2px;position:relative}
.nb-fd.sel{background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 18%,transparent),transparent)}
.nb-fd.sel::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-fd.drop{outline:1px dashed var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.nb-fdb{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;cursor:pointer;font:500 13px/1.2 var(--sans);color:var(--muted)}
.nb-fdb:hover,.nb-fd.sel .nb-fdb{color:var(--text)}
.nb-fdb:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-fic{width:14px;text-align:center;color:var(--amber);flex:none}
.nb-fnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-fn{font:500 11px/1 var(--mono);color:var(--faint)}
.nb-fx{all:unset;cursor:pointer;font-size:11px;color:var(--faint);padding:4px 5px;opacity:0;border-radius:2px}
.nb-fd:hover .nb-fx,.nb-fx:focus-visible,.nb-fx.armed{opacity:1}
.nb-fx:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nb-fx.armed{color:var(--red);font:600 10px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase}
.nb-fx:focus-visible{outline:2px solid var(--frame)}
.nb-fadd{all:unset;cursor:pointer;margin-top:8px;padding:7px 10px;font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-2);border-radius:2px;text-align:center}
.nb-fadd:hover{color:var(--text);border-color:var(--frame)}

.nb-chips{display:contents}
.nb-nolink{font-size:12px;color:var(--faint)}

/* ---------- notes toolbar, text colours, emoji/symbol panel (web/src/notes-widgets.js) ---------- */
.nr-tools{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:6px 14px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.1)}

.nr-tools>button:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.04)}

.nb-rich span[data-c="amber"]{color:var(--amber)} .nb-rich span[data-c="cyan"]{color:var(--cyan)} .nb-rich span[data-c="pink"]{color:var(--pink)}
.nb-rich span[data-c="violet"]{color:var(--violet)} .nb-rich span[data-c="green"]{color:var(--green)} .nb-rich span[data-c="magenta"]{color:var(--magenta)}
.nb-rich span[data-c="lime"]{color:var(--lime)} .nb-rich span[data-c="red"]{color:var(--red)} .nb-rich span[data-c="muted"]{color:var(--muted)}
.nr-panel.win{position:fixed;z-index:2100;display:flex;flex-direction:column;height:320px;box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 30px var(--glow);animation:vt-in .2s ease}

.nr-px{all:unset;cursor:pointer;padding:4px 8px;color:var(--faint)}

.nr-ch:hover,.nr-ch:focus-visible{background:color-mix(in srgb,var(--frame) 18%,transparent);outline:none}

/* ---------- note widgets: code box and music chart ---------- */
.nb-rich .nw{display:block;margin:10px 0;border:1px solid var(--line-2);border-left:3px solid var(--violet);border-radius:4px;background:var(--panel);white-space:normal;user-select:none;cursor:default;max-width:100%}

.nw-gut span{font:inherit}
.nw-edit{position:relative;min-width:0}
.nw-hl,.nw-ta{margin:0;padding:10px 12px;font:inherit;white-space:pre;tab-size:4;overflow:hidden;box-sizing:border-box;width:100%}
.nw-hl{position:absolute;inset:0;pointer-events:none;color:var(--text)}
.nw-ta{position:relative;display:block;resize:none;border:0;outline:none;background:transparent;color:transparent;caret-color:var(--amber);overflow-x:auto;user-select:text}

.nw-hl .kw{color:var(--violet)} .nw-hl .bi{color:var(--cyan)} .nw-hl .str{color:var(--green)} .nw-hl .num{color:var(--amber)} .nw-hl .com{color:var(--faint);font-style:italic}
.nw-staff{overflow-x:auto;padding:4px 8px 0;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.ms{display:block}

.ms .ms-over{stroke:var(--red);stroke-width:2}
.ms .ms-ink{stroke:var(--text)}
.ms .ms-fill{fill:var(--text)}
.ms .ms-hollow{fill:none;stroke:var(--text);stroke-width:1.6}
.ms .ms-time{font:700 17px/1 var(--math);fill:var(--text)}
.ms .ms-sym{font:600 13px/1 var(--sans);fill:var(--magenta)}
.ms .ms-acc{font:400 15px/1 var(--math);fill:var(--text)}

.ms .ms-hollow.ms-hot{fill:none}
.ms text.ms-hot,.ms rect.ms-hot{stroke:none}
.nw-mtools{display:grid;gap:8px;padding:8px 10px 10px;border-top:1px solid var(--line)}
.nw-durs{display:flex;flex-wrap:wrap;gap:4px}

.nw-durs button small{font:500 9px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.nw-durs button[aria-checked="true"],.nw-durs button[aria-pressed="true"]{border-color:var(--magenta);background:color-mix(in srgb,var(--magenta) 16%,transparent)}

.nw-keys{display:flex;align-items:stretch;gap:6px}

.nw-piano .wk:hover{background:linear-gradient(180deg,#fff,#f3dcf6)} .nw-piano .bk:hover{background:linear-gradient(180deg,#6a4d73,#2d1d33)}

/* ---------- notes drag and drop: nested folders, My order (1.16.1) ---------- */

.nb-fcar{all:unset;flex:none;width:16px;margin-left:6px;text-align:center;font-size:11px;color:var(--amber);cursor:pointer;border-radius:2px}
span.nb-fcar{cursor:inherit;color:var(--faint)}

/* ---------- notes text sizes, Assist linked notes (1.16.1) ---------- */
@property --nb-base{syntax:"<length>";inherits:true;initial-value:15px}
.nb-rich{--nb-base:1em} /* computed once, at the editor's own size, then inherited as px: nested sizes never compound */
.nb-rich span[data-s="s"]{font-size:calc(var(--nb-base) * .82)} .nb-rich span[data-s="n"]{font-size:var(--nb-base)}
.nb-rich span[data-s="l"]{font-size:calc(var(--nb-base) * 1.3);line-height:1.4} .nb-rich span[data-s="xl"]{font-size:calc(var(--nb-base) * 1.75);line-height:1.3}
.nr-sizes{display:inline-flex;align-items:flex-end;gap:1px}
.nr-sz{all:unset;box-sizing:border-box;cursor:pointer;min-width:24px;height:28px;padding:0 4px;display:inline-grid;place-items:end center;padding-bottom:6px;border:1px solid transparent;border-radius:2px;color:var(--muted);font-family:var(--sans);font-weight:600;line-height:1}
.nr-sz:hover{color:var(--text);border-color:var(--line-2);background:rgba(255,255,255,.04)}
.nr-sz:focus-visible{outline:2px solid var(--frame)}
.nr-sz-s{font-size:11px!important} .nr-sz-n{font-size:13.5px!important} .nr-sz-l{font-size:16.5px!important} .nr-sz-xl{font-size:20px!important}
/* ---------- My notes: fold tabs + list resizer (notesLayout in app.js) ---------- */
.nb-fold{position:absolute;z-index:6;top:50%;transform:translate(-50%,-50%);width:18px;height:64px;padding:0;display:grid;place-items:center;cursor:pointer;
  background:linear-gradient(180deg,var(--panel-3),var(--panel-2));border:1px solid var(--line-2);border-radius:3px;color:var(--muted);font:400 10px/1 var(--ui);
  box-shadow:0 4px 14px rgba(0,0,0,.4);transition:left .32s cubic-bezier(.2,.7,.2,1),color .15s,border-color .15s,box-shadow .15s}
.nb-fold:hover{color:var(--text);border-color:var(--frame);box-shadow:0 0 12px var(--glow)}
.nb-fold:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nb-fold[data-p="f"]{left:max(9px,var(--nb-fw));top:38%}
.nb-fold[data-p="l"]{left:max(9px,calc(var(--nb-fw) + var(--nb-lw)));top:62%}

@container (max-width:640px){ .ng-body{grid-template-columns:minmax(0,1fr)} .ng-plot{border-right:0;border-bottom:1px solid var(--line)} }

/* ---------- My notes as a page (#notes, renderNotesPage in app.js): no fog, no window over the menu ---------- */
.npage{height:100%;box-sizing:border-box;padding:14px 16px 16px;display:flex;flex-direction:column;overflow:hidden}
.np-win{flex:1;min-height:0;width:min(1440px,100%);margin:0 auto;display:flex;flex-direction:column}
.np-win .mw-body>.nb{flex:1;min-height:0;height:auto}
.np-newb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:2px;
  font:700 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 82%,#fff),var(--frame));border:1px solid color-mix(in srgb,var(--frame) 70%,#fff);
  box-shadow:0 0 18px color-mix(in srgb,var(--frame) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:box-shadow .15s,filter .15s}
.np-newb:hover{filter:brightness(1.08);box-shadow:0 0 26px color-mix(in srgb,var(--frame) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.np-newb:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:860px){ .npage{overflow:auto;padding:8px} .np-win{flex:none} .np-win .mw-body>.nb{flex:none} }
/* the note bar: ☆ on the left, the buttons on the right (no folder picker or "Saved": Devon, Oct 2026) */
.nb-bar .nb-bar-r{margin-left:auto}

/* folders column: every folder folds (▾/▸) and lists its notes under its folders */
.nb{--nb-fw:var(--nb-fw-user,200px)}
@media (max-width:1100px){ .nb{--nb-fw:var(--nb-fw-user,170px)} }
.nb-fnote{display:flex;align-items:center;gap:7px;padding:5px 8px 5px calc(10px + var(--d,1) * 14px);border-radius:2px;cursor:pointer;position:relative;
  font:400 12.5px/1.25 var(--sans);color:var(--muted);-webkit-user-drag:element}
.nb-fnote:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nb-fnote.sel{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 12%,transparent),transparent)}
.nb-fnote.sel::before{content:"";position:absolute;left:calc(var(--d,1) * 14px);top:5px;bottom:5px;width:2px;background:var(--frame)}
.nb-fnote:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-fnote.dragging{opacity:.45}
.nb-fni{flex:none;width:12px;text-align:center;color:var(--faint);font-size:11px}
.nb-fnote .nb-fni:not(:empty){color:var(--faint)}
.nb-fnt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-fd.user .nb-fcar{color:var(--frame)}
.nb-rzf{position:absolute;z-index:5;top:0;bottom:0;left:var(--nb-fw);width:10px;transform:translateX(-50%);cursor:col-resize;touch-action:none;transition:left .32s cubic-bezier(.2,.7,.2,1)}
.nb-rzf::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s,box-shadow .15s}
.nb-rzf:hover::after,.nb.rz .nb-rzf::after,.nb-rzf:focus-visible::after{background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-rzf:focus-visible{outline:none}
.nb.ffold .nb-rzf,.nb.rz .nb-rzf{transition:none}
.nb.ffold .nb-rzf{display:none}
@media (max-width:860px){ .nb-rzf{display:none} .nb-fnote{flex:0 0 auto;padding-left:8px} .nb-fnote.sel::before{left:0} }

/* editor: one note, or two side by side (.split); a minimised side note is a tab above (.nb-tabs) */
.nb-ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.nb-panes{flex:1;min-height:0;display:flex}
.nb-pane{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column}
.nb-pane[hidden]{display:none}
.nb-pane.p2{border-left:1px solid var(--line);background:rgba(0,0,0,.08)}
.nb-p2h{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.nb-p2tag{margin-right:auto;font:600 10.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--frame)}
.nb-p2b{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border:1px solid transparent;border-radius:2px;color:var(--muted);font-size:13px}
.nb-p2b:hover{color:var(--text);border-color:var(--line-2)}
.nb-p2b:focus-visible{outline:2px solid var(--frame)}
.nb-tabs{display:flex;gap:6px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:rgba(0,0,0,.12)}
.nb-tabs[hidden]{display:none}
.nb-tab{display:flex;align-items:center;max-width:300px;border:1px solid var(--line-2);border-bottom:0;border-radius:3px 3px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 12%,var(--panel-2)),var(--panel-2));box-shadow:inset 0 2px 0 var(--frame)}
.nb-tab-t{all:unset;cursor:pointer;min-width:0;display:flex;gap:6px;align-items:center;padding:7px 10px;font:500 13px/1.2 var(--sans);color:var(--text)}
.nb-tab-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-tab-b{all:unset;cursor:pointer;padding:6px 8px;color:var(--muted);font-size:12px}
.nb-tab-t:focus-visible,.nb-tab-b:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-tab-b:hover{color:var(--text)}
.nb-trow{display:flex;align-items:center;gap:10px;padding-right:12px}
.nb-trow .nb-title{flex:1;min-width:0}
/* ⧉ drop spot: only while a note is being dragged */
.nb-split{display:none;align-items:center;gap:8px;padding:8px 12px;border:1px dashed var(--frame);border-radius:3px;color:var(--frame);font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  background:color-mix(in srgb,var(--frame) 10%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--frame) 30%,transparent);animation:np-pulse 1.4s ease-in-out infinite}
.nb-split-ic{font-size:16px;letter-spacing:0}
.nb.dragnote .p1 .nb-split{display:flex}
.nb.dragnote.dragself .p1 .nb-split{display:none}
.nb-split.over{background:color-mix(in srgb,var(--frame) 28%,transparent);color:var(--text);border-style:solid;box-shadow:0 0 24px color-mix(in srgb,var(--frame) 60%,transparent)}
@keyframes np-pulse{50%{box-shadow:0 0 4px color-mix(in srgb,var(--frame) 20%,transparent)}}
.nb.dragnote .nb-rich{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--frame) 35%,transparent)}
.nb-dcaret{position:fixed;z-index:2200;width:2px;background:var(--frame);box-shadow:0 0 8px var(--frame);pointer-events:none}
@media (max-width:860px){ .nb-panes{flex-direction:column} .nb-pane{flex:none;min-height:360px} .nb-pane.p2{border-left:0;border-top:1px solid var(--line)} .nb-split span:not(.nb-split-ic){display:none} }
@media (prefers-reduced-motion:reduce){ .nb-split{animation:none} }

/* starred folders: ★ stays lit and the folder sits at the top of its level */
.nb-fx.nb-ffav.on{opacity:1;color:var(--amber)}
.nb-fx.nb-ffav:hover{color:var(--amber)}

/* ↶ Undo / ↷ Redo in the My notes header */
.np-hist{display:inline-flex;gap:4px}
.np-hb{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 11px;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.18)}
.np-hb:hover:not(:disabled){color:var(--text);border-color:var(--frame)}
.np-hb:focus-visible{outline:2px solid var(--frame)}
.np-hb:disabled{opacity:.4;cursor:default}
@media (max-width:860px){ .np-hb{padding:8px 8px} }

/* lead sheet widget (notes-sheet.js) */
.nb-rich .nw[data-w="sheet"]{border-left-color:var(--magenta)}
.nw[data-w="sheet"] .nw-tag{color:var(--magenta);font-size:17px}
.nw .sh-comp{flex:0 1 150px;min-width:80px;text-transform:none;letter-spacing:0;font:400 12.5px/1.2 var(--sans)}
.nw-h select.sh-key,.nw-h select.sh-clef,.nw-h select.sh-time{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:3px 5px;font:400 12px/1.2 var(--sans)}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:12px 16px 0;min-height:10px}
.sh-t{grid-column:2;font:400 24px/1.2 var(--math);color:var(--text);text-align:center}
.sh-c{grid-column:3;justify-self:end;font:italic 400 13px/1.2 var(--math);color:var(--muted)}
.sh-staff{padding:2px 8px 6px;overflow-x:auto}
.sh-svg{width:100%;min-width:560px;height:auto}
.sh-svg .sh-bar{fill:transparent;cursor:pointer;stroke:none}
.sh-svg .sh-bar:hover{fill:color-mix(in srgb,var(--frame) 6%,transparent)}
.sh-svg .sh-bar.on{fill:color-mix(in srgb,var(--frame) 13%,transparent);stroke:color-mix(in srgb,var(--frame) 60%,transparent);stroke-width:1}
.sh-svg .sh-chord{font:600 16px/1 var(--math);fill:var(--text);pointer-events:none}
.sh-svg .sh-num{font:400 10px/1 var(--mono);fill:var(--faint);pointer-events:none}
.sh-svg .sh-over{font:600 9px/1 var(--ui);letter-spacing:.1em;fill:var(--red);text-transform:uppercase}
.sh-svg text,.sh-svg line,.sh-svg path,.sh-svg ellipse,.sh-svg circle{pointer-events:none}
.sh-barrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sh-barn{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);min-width:96px;text-align:center}
.sh-chordl{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sh-chords,.sh-mel{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 8px;font:500 14px/1.2 var(--math);user-select:text}
.sh-chords{width:150px}.sh-mel{width:100%;box-sizing:border-box;font:400 12.5px/1.3 var(--mono)}
.sh-chords:focus,.sh-mel:focus{outline:none;border-color:var(--frame)}
.sh-sp{flex:1}
.sh-all summary{cursor:pointer;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.sh-all[open] summary{color:var(--text)}

/* right-click → Translate: the language box under the menu (textmenu.js) */
.tm-tr{margin-top:5px;padding:8px;border:1px solid color-mix(in srgb,var(--frame) 45%,var(--line-2));border-radius:3px;background:rgba(0,0,0,.22);display:grid;gap:8px;animation:vt-in .16s ease}
.tm-trh{font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tm-langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.tm-menu .tm-lang{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 9px;border:1px solid var(--line-2);border-radius:2px;grid-template-columns:none}
.tm-menu .tm-lang b{font:600 12.5px/1.1 var(--sans)}
.tm-menu .tm-lang small{font-size:10.5px}
.tm-menu .tm-lang[aria-pressed="true"]{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 16%,transparent)}
.tm-trout:empty{display:none}
.tm-trtext{margin:0;font:400 14px/1.5 var(--sans);color:var(--text);max-height:180px;overflow:auto;user-select:text}
.tm-tr .tm-dacts{display:flex;flex-wrap:wrap;gap:14px}
.tm-tr .tm-dfoot{margin:0;font-size:11px;color:var(--faint)}

</style>

<script>/* web/lib/python-tokens.js */
/* ============ Subject kit: Computer Science (Programming Fundamentals onward) ============
   Every program a lab shows is REAL Python: write it in web/cs-src/<topic-id>.py and run
   `python3 tools/pytrace.py <topic-id>`; that records each step CPython takes into web/traces/<topic-id>.js
   (window.CSTraces["<id>/<program>"]). Labs only play traces back, so a lab can never disagree with Python.
   Two layers:
   1. window.CSRules (CR): pure, DOM-free rules, tested in tests/cs.test.js (node tools/labtest.js cs):
      tokens(line) Python highlighting · show(val, heap) Python-style display text · frames/out/changed per step ·
      watch(trace, name) a variable's value at every step · bits (toBase, fromBase, twos, fromTwos, utf8) · shuffle(arr, seed).
   2. window.CSKit.attach(k): k.trace(cfg) the whole Trace / Memory / Array lab in one call, k.predict(cfg) predict-then-run,
      k.bits(cfg) bit board, k.csModes(list, build) mode switching, k.guard(list), k.csro(o) standard readout.
   House colour keys for every CS page (the legend must use them): c1 amber = line about to run, c2 cyan = variable that
   just changed, c3 pink = output, c4 violet = references / objects, c5 green = return values. */
(function(){
const W = window;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- 1. CSRules ---------------- */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input int float str bool len range list dict set tuple sum min max abs round sorted enumerate zip type isinstance open map filter reversed any all chr ord".split(" "));
function tokens(line){
  const out = []; let i = 0;
  const push = (t, s) => { if (s) out.push({ t, s }); };
  while (i < line.length) {
    const r = line.slice(i);
    let m;
    if ((m = r.match(/^#.*/))) { push("com", m[0]); break; }
    if ((m = r.match(/^[rRbBfF]{0,2}("""|'''|"(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)/)) && (m[1] !== '"""' && m[1] !== "'''" || true)) { push("str", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^\d+(\.\d*)?([eE][+-]?\d+)?j?|^\.\d+/))) { push("num", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^[A-Za-z_]\w*/))) { const w = m[0]; push(KW.has(w) ? "kw" : BI.has(w) ? "bi" : "name", w); i += w.length; continue; }
    if ((m = r.match(/^\s+/))) { push("ws", m[0]); i += m[0].length; continue; }
    push("op", line[i]); i++;
  }
  // merge neighbouring ops/ws so the HTML stays small
  return out.reduce((a, x) => { const l = a[a.length - 1]; if (l && l.t === x.t && (x.t === "op" || x.t === "ws")) l.s += x.s; else a.push({ ...x }); return a; }, []);
}

// Display text for a traced value, Python style. Cycles show as [...].
function show(v, heap, seen = new Set()){
  if (!v) return "";
  const [kind, x] = v;
  if (kind === "v") return x;
  if (kind === "fn") return `function ${x}`;
  if (kind === "cls") return `class ${x}`;
  const o = heap[x]; if (!o) return "…";
  if (o.t === "val") return o.v;
  if (seen.has(x)) return o.t === "dict" ? "{...}" : "[...]";
  const s2 = new Set(seen); s2.add(x);
  const items = o.t === "dict" || o.t === "obj" ? null : o.v.map(e => show(e, heap, s2));
  if (o.t === "list") return `[${items.join(", ")}]`;
  if (o.t === "tuple") return items.length === 1 ? `(${items[0]},)` : `(${items.join(", ")})`;
  if (o.t === "set") return items.length ? `{${items.join(", ")}}` : "set()";
  if (o.t === "dict") return `{${o.v.map(([a, b]) => show(a, heap, s2) + ": " + show(b, heap, s2)).join(", ")}}`;
  return `${o.c}(${o.v.map(([a, b]) => a + "=" + show(b, heap, s2)).join(", ")})`;

const stepAt = (T, i) => T.steps[Math.max(0, Math.min(T.steps.length - 1, i))];
const outAt = (T, i) => T.out.slice(0, stepAt(T, i).o);
// How many times line `line` has started running in steps 0…i (loop passes: give the first line of the body).
const hits = (T, i, line) => T.steps.slice(0, Math.max(0, i) + 1).filter(s => s.ev === "line" && s.l === line).length;
// Names whose shown value differs from the step before: Set of "depth:name" (depth 0 = global frame).
function changed(T, i){
  const res = new Set(); if (i <= 0) return res;
  const a = stepAt(T, i - 1), b = stepAt(T, i);
  b.f.forEach((fr, d) => {
    const pf = a.f[d] && a.f[d].fn === fr.fn ? a.f[d] : null;
    for (const [n, v] of Object.entries(fr.vars)) if (!pf || !(n in pf.vars) || show(pf.vars[n], a.h) !== show(v, b.h)) res.add(d + ":" + n);
  });
  return res;
}
// A global (or innermost-frame, inner: true) variable's shown value at every step; undefined before it exists.
const watch = (T, name, inner) => T.steps.map(s => { const fr = inner ? s.f[s.f.length - 1] : s.f[0]; return fr && name in fr.vars ? show(fr.vars[name], s.h) : undefined; });
// Python list of numbers at step i as a JS array (for the array view), or null.
function nums(T, i, name){
  const s = stepAt(T, i); const fr = s.f.find(f => name in f.vars) ; const v = fr && fr.vars[name];
  if (!v || v[0] !== "r" || !s.h[v[1]] || s.h[v[1]].t !== "list") return null;
  return s.h[v[1]].v.map(e => (e[0] === "v" ? Number(e[1]) : NaN));
}
const evText = (T, i) => { const s = stepAt(T, i), fn = s.f.length ? s.f[s.f.length - 1].fn : "";
  return s.ev === "end" ? "program finished" : s.ev === "call" ? `calling ${fn}()` : s.ev === "return" ? `${fn}() returns ${show(s.r, s.h)}` : s.ev === "exc" ? "an exception is raised" : `about to run line ${s.l}`; };

// Bits. toBase(13, 2, 8) = "00001101"; fromBase("ff", 16) = 255; twos(-3, 8) = "11111101"; fromTwos("11111101") = -3.
const toBase = (n, b, w = 0) => { if (!Number.isInteger(n) || n < 0) throw new Error("CSRules.toBase: needs a whole number ≥ 0 (use twos for negatives)"); return n.toString(b).toUpperCase().padStart(w, "0"); };
const fromBase = (s, b) => { const v = parseInt(String(s).replace(/_/g, ""), b); if (!Number.isFinite(v)) throw new Error(`CSRules.fromBase: "${s}" is not base ${b}`); return v; };
const twos = (n, w) => { const lo = -(2 ** (w - 1)), hi = 2 ** (w - 1) - 1; if (n < lo || n > hi) throw new Error(`CSRules.twos: ${n} does not fit in ${w} bits (${lo}…${hi})`); return toBase(n < 0 ? 2 ** w + n : n, 2, w); };

const utf8 = ch => { const c = ch.codePointAt(0); if (c < 0x80) return [c]; if (c < 0x800) return [0xC0 | c >> 6, 0x80 | c & 63];
  if (c < 0x10000) return [0xE0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63]; return [0xF0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63]; };
const shuffle = (arr, seed) => { const a = arr.slice(); let s = seed == null ? null : seed;
  const rnd = () => { if (s == null) return Math.random(); s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CR = W.CSRules = { tokens, show, stepAt, outAt, hits, changed, watch, nums, evText, toBase, fromBase, twos, fromTwos, utf8, shuffle, esc };
})();

<script>/* web/lib/music-theory.js */
/* ============ Subject kit: Music ============
   Two layers, so labs only write what is unique to their topic:
   1. window.MusicTheory (MT): pure, DOM-free rules: pitch spelling, MIDI and frequency, intervals,
      transposition, scales, key signatures, clef positions, exact rhythm values, meters, harmonics.
      Tested in tests/music.test.js (node tools/labtest.js music). Put any new rule a lab needs HERE, with a test.
   2. window.MusicKit.attach(k): drawing and sound on top of the lab kit `k` (web/kits/universal/core.js):
      staff with vector clefs, notes, rests, accidentals, time and key signatures, beams, a piano keyboard,
      and a small Web Audio synth (never autoplays; sound starts only from a button or a key press).
   API summary is in web/WRITER-PACK-MUSIC.md. */
(function(){
const W = window;

/* ---------------- 1. MusicTheory: rules ---------------- */
const LET = "CDEFGAB", NAT = [0, 2, 4, 5, 7, 9, 11];
const ACC_U = { "-2": "𝄫", "-1": "♭", "0": "", "1": "♯", "2": "𝄪" }, ACC_A = { "-2": "bb", "-1": "b", "0": "", "1": "#", "2": "x" };
const mod = (a, n) => ((a % n) + n) % n;

// Exact rationals for rhythm (durations in whole notes).
function R(n, d = 1){ if (d < 0) { n = -n; d = -d; } const g = gcdI(Math.abs(n), d) || 1; return Object.freeze({ n: n / g, d: d / g, add: o => R(n * o.d + o.n * d, d * o.d), sub: o => R(n * o.d - o.n * d, d * o.d), mul: o => R(n * o.n, d * o.d), div: o => R(n * o.d, d * o.n), eq: o => n * o.d === o.n * d, lt: o => n * o.d < o.n * d, val: n / d, toString: () => d / g === 1 ? String(n / g) : `${n / g}/${d / g}` }); }
function gcdI(a, b){ while (b) [a, b] = [b, a % b]; return a; }

function parse(s){
  if (typeof s === "object") return s;
  const m = String(s).trim().match(/^([A-Ga-g])(𝄪|𝄫|♯|♭|♮|##|bb|#|b|x|n)?(-?\d+)?$/);
  if (!m) throw new Error(`MusicTheory.parse: "${s}" is not a pitch like C4, F#3, Bb5`);
  const a = { "𝄪": 2, "x": 2, "##": 2, "♯": 1, "#": 1, "♭": -1, "b": -1, "𝄫": -2, "bb": -2, "♮": 0, "n": 0 }[m[2] || ""] || 0;
  return { l: LET.indexOf(m[1].toUpperCase()), a, o: m[3] === undefined ? 4 : +m[3] };
}
const accSym = (a, ascii) => (ascii ? ACC_A : ACC_U)[a] ?? (a > 0 ? "♯".repeat(a) : "♭".repeat(-a));
const name = (p, o = {}) => { p = parse(p); return LET[p.l] + accSym(p.a, o.ascii) + (o.octave === false ? "" : p.o); };
const midi = p => { p = parse(p); return 12 * (p.o + 1) + NAT[p.l] + p.a; };
const pc = p => mod(midi(p), 12);
const dia = p => { p = parse(p); return p.o * 7 + p.l; };            // diatonic step number (letter + octave)
const freq = (p, a4 = 440) => a4 * Math.pow(2, ((typeof p === "number" ? p : midi(p)) - 69) / 12);
const fromDia = (d, a = 0) => ({ l: mod(d, 7), a, o: Math.floor(d / 7) });
// All reasonable spellings (accidentals −2…+2) of a MIDI note, simplest first.
function spellings(m){ const out = []; for (let l = 0; l < 7; l++) for (const a of [0, 1, -1, 2, -2]) { const base = NAT[l] + a, o = Math.floor((m - base) / 12) - 1; if (12 * (o + 1) + base === m) out.push({ l, a, o }); } return out.sort((x, y) => Math.abs(x.a) - Math.abs(y.a)); }
// Default spelling for a key on the keyboard: naturals, else sharp (flats if prefer < 0).
const fromMidi = (m, prefer = 1) => { const s = spellings(m); return s.find(x => x.a === 0) || s.find(x => Math.sign(x.a) === Math.sign(prefer) && Math.abs(x.a) === 1) || s[0]; };

const SIZE = ["unison", "second", "third", "fourth", "fifth", "sixth", "seventh", "octave", "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "double octave"];
const PERFECT = s => [1, 4, 5].includes(s);
const QLONG = { P: "perfect", M: "major", m: "minor", A: "augmented", d: "diminished", AA: "doubly augmented", dd: "doubly diminished" };
// Interval from p up to q (q must not be below p in letter+octave).
function interval(p, q){
  const size = dia(q) - dia(p) + 1;
  if (size < 1) throw new Error("MusicTheory.interval: second pitch is below the first; pass the lower note first");
  const simple = mod(size - 1, 7) + 1, semis = midi(q) - midi(p);
  const ref = NAT[simple - 1] + 12 * Math.floor((size - 1) / 7), diff = semis - ref;
  const quality = PERFECT(simple) ? ({ 0: "P", 1: "A", "-1": "d", 2: "AA", "-2": "dd" })[diff] : ({ 0: "M", "-1": "m", 1: "A", "-2": "d", 2: "AA", "-3": "dd" })[diff];
  if (!quality) return { size, simple, semis, quality: "?", short: `?${size}`, long: "not a standard interval", compound: size > 8 };
  return { size, simple, semis, quality, short: quality + size, long: `${QLONG[quality]} ${SIZE[size - 1] || size + "th"}`, compound: size > 8 };
}
function ivParse(s){ const m = String(s).match(/^(AA|dd|P|M|m|A|d)(\d+)$/); if (!m) throw new Error(`MusicTheory: "${s}" is not an interval like M3, P5, A4`); return { q: m[1], size: +m[2] }; }
function ivSemis(q, size){ const simple = mod(size - 1, 7) + 1, ref = NAT[simple - 1] + 12 * Math.floor((size - 1) / 7);
  const off = PERFECT(simple) ? { P: 0, A: 1, d: -1, AA: 2, dd: -2 }[q] : { M: 0, m: -1, A: 1, d: -2, AA: 2, dd: -3 }[q];
  if (off === undefined) throw new Error(`MusicTheory: ${q}${size} does not exist (${PERFECT(simple) ? "perfect" : "major/minor"} class)`); return ref + off; }
function up(p, iv){ p = parse(p); const { q, size } = ivParse(iv); const t = fromDia(dia(p) + size - 1); t.a = midi(p) + ivSemis(q, size) - midi({ ...t, a: 0 }); return t; }
function down(p, iv){ p = parse(p); const { q, size } = ivParse(iv); const t = fromDia(dia(p) - size + 1); t.a = midi(p) - ivSemis(q, size) - midi({ ...t, a: 0 }); return t; }
// Interval inversion (simple intervals): sizes sum to 9, M↔m, A↔d, P stays P.
const invert = iv => { const { q, size } = ivParse(iv); const s = mod(size - 1, 7) + 1; return ({ P: "P", M: "m", m: "M", A: "d", d: "A", AA: "dd", dd: "AA" })[q] + (9 - s); };

const SCALES = {
  major: [0, 2, 4, 5, 7, 9, 11], "natural minor": [0, 2, 3, 5, 7, 8, 10], "harmonic minor": [0, 2, 3, 5, 7, 8, 11], "melodic minor": [0, 2, 3, 5, 7, 9, 11],
  ionian: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11], mixolydian: [0, 2, 4, 5, 7, 9, 10], aeolian: [0, 2, 3, 5, 7, 8, 10], locrian: [0, 1, 3, 5, 6, 8, 10]
};
// A seven-note scale spelled with one of each letter, ascending from tonic, plus the octave.
function scale(tonic, kind = "major"){ tonic = parse(tonic); const pat = SCALES[kind]; if (!pat) throw new Error("MusicTheory.scale: unknown kind " + kind);
  const out = pat.map((s, i) => { const t = fromDia(dia(tonic) + i); t.a = midi(tonic) + s - midi({ ...t, a: 0 }); return t; });
  out.push({ ...tonic, o: tonic.o + 1 }); return out; }
const DEGREE = ["tonic", "supertonic", "mediant", "subdominant", "dominant", "submediant", "leading tone"];
// Key signature as signed count: +n sharps, −n flats. Major from the circle of fifths; a minor key shares its relative major's.
const FIFTHS = [0, 2, 4, -1, 1, 3, 5];          // C D E F G A B majors
function keySig(tonic, mode = "major"){ const t = parse(tonic); return FIFTHS[t.l] + 7 * t.a - (mode === "minor" ? 3 : 0); }
const sigLetters = n => n >= 0 ? "FCGDAEB".slice(0, n).split("") : "BEADGCF".slice(0, -n).split("");
// Pitch spelled under a key signature: the letter's accidental from the signature.
const sigAcc = (n, l) => (n > 0 && sigLetters(n).includes(LET[l])) ? 1 : (n < 0 && sigLetters(n).includes(LET[l])) ? -1 : 0;

// Staff positions: 0 = bottom line, 1 = first space, 2 = second line … 8 = top line. Clefs named by their bottom-line pitch.
const CLEFS = { treble: { bottom: "E4", line: 2, pitch: "G4" }, bass: { bottom: "G2", line: 6, pitch: "F3" }, alto: { bottom: "F3", line: 4, pitch: "C4" }, tenor: { bottom: "D3", line: 6, pitch: "C4" } };
const staffPos = (p, clef = "treble") => dia(p) - dia(CLEFS[clef].bottom);
const fromStaffPos = (pos, clef = "treble", a = 0) => fromDia(dia(CLEFS[clef].bottom) + pos, a);
const ledgers = pos => { const out = []; for (let y = -2; y >= pos; y -= 2) out.push(y); for (let y = 10; y <= pos; y += 2) out.push(y); return out; };

// Rhythm. Durations in whole notes (exact).
const DUR = { whole: R(1), half: R(1, 2), quarter: R(1, 4), eighth: R(1, 8), sixteenth: R(1, 16), "thirty-second": R(1, 32) };
const dur = (kind, dots = 0) => { const v = DUR[kind]; if (!v) throw new Error("MusicTheory.dur: unknown value " + kind); return v.mul(R(2 ** (dots + 1) - 1, 2 ** dots)); };
// Meter from a time signature like "3/4". Compound when the top is 6, 9 or 12 (beat = dotted note, three divisions).
function meter(sig){ const [top, bottom] = String(sig).split("/").map(Number);
  if (!(top > 0) || ![1, 2, 4, 8, 16, 32].includes(bottom)) throw new Error("MusicTheory.meter: bad time signature " + sig);
  const unit = R(1, bottom), measure = R(top, bottom);
  const compound = top > 3 && top % 3 === 0, asym = !compound && [5, 7, 11, 13].includes(top);
  const beats = compound ? top / 3 : top, beat = compound ? unit.mul(R(3)) : unit;
  const kind = compound ? "compound" : asym ? "asymmetric" : "simple";
  const group = asym ? `${top} unequal` : ({ 1: "single", 2: "duple", 3: "triple", 4: "quadruple" })[beats] || `${beats}-beat`;
  return { top, bottom, unit, measure, beats, beat, kind, group, division: compound ? 3 : 2, name: `${kind} ${group}` }; }
// Split a list of durations into measures; reports overflow (a note crossing the bar line).
function bar(sig, durs){ const m = meter(sig); const bars = []; let cur = [], sum = R(0);
  for (const d of durs) { cur.push(d); sum = sum.add(d); if (sum.eq(m.measure)) { bars.push({ notes: cur, sum, full: true }); cur = []; sum = R(0); } else if (m.measure.lt(sum)) { bars.push({ notes: cur, sum, full: false, over: sum.sub(m.measure) }); cur = []; sum = R(0); } }
  if (cur.length) bars.push({ notes: cur, sum, full: false, short: m.measure.sub(sum) }); return bars; }

// Acoustics
const harmonics = (f0, n = 8) => Array.from({ length: n }, (_, i) => ({ n: i + 1, f: f0 * (i + 1) }));
const cents = r => 1200 * Math.log2(r);
const nearest = f => { const m = 69 + 12 * Math.log2(f / 440), r = Math.round(m); return { midi: r, cents: 100 * (m - r) }; };
const period = f => 1 / f;

W.MusicTheory = { LET, NAT, R, parse, name, midi, pc, dia, freq, fromDia, spellings, fromMidi, accSym, interval, up, down, invert, ivSemis: (s) => { const { q, size } = ivParse(s); return ivSemis(q, size); },
  SCALES, scale, DEGREE, keySig, sigLetters, sigAcc, CLEFS, staffPos, fromStaffPos, ledgers, DUR, dur, meter, bar, harmonics, cents, nearest, period, SIZE, QLONG };

})();

   Inquire's ("<prefix>.notes.<user>") so the notes engine stays the same and accounts could be added later. */
(function () {
"use strict";
const user = () => (window.InquireUser ? String(window.InquireUser).toLowerCase() : "");
window.InquireKeys = {

  notes: () => "notepath.notes." + (user() || "_local"),

/* Notes: the store, folders, photos and the rich note editor (cloned from Inquire's notes.js).
   Loaded before app.js (the start menu and My notes read it).
   Notes live in localStorage "notepath.notes.<username>" (lower-case), or "notepath.notes._local" with nobody signed in.
   Each note: { id, title, html (sanitised rich text), body (plain text made from html: search, previews, .md),
     created, updated, fav, folder (folder id | null), links: ["s:<subject>", "f:<field>", "t:<topic>"], src: { topic, title } | null }.
   Older notes (body only) get html on read. Folders: "notepath.notefolders.<username>" = [{ id, name, parent, order, fav? }] (nested; drag to move/reorder). Notes may carry `order` (My order).
   Photos: IndexedDB "notepath-notes" / "images" (Blob by id); a note holds <img data-img="id">, a linked photo <img src="https://…">.
   Links inside a note: <a class="nlink" data-note="id"> (another note) or data-topic="id" (a lesson); colour = --note-link (Settings).
   Every change fires "inquire:notes-changed" so open views redraw. */
(function () {
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const key = () => window.InquireKeys.notes();
const fkey = () => key().replace(/^notepath\.notes\./, "notepath.notefolders.");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byUpdated = (a, b) => b.updated - a.updated;
const changed = () => window.dispatchEvent(new CustomEvent("inquire:notes-changed"));

/* ---------- rich text: sanitise, plain text ---------- */
const KEEP = new Set(["B", "STRONG", "I", "EM", "U", "S", "STRIKE", "BR", "DIV", "P", "UL", "OL", "LI", "H3", "BLOCKQUOTE", "A", "IMG", "SPAN"]);
const TCOL = { "#f2b84b": "amber", "#5cc8e0": "cyan", "#f07ca0": "pink", "#b49bff": "violet", "#7bd88f": "green", "#d97ae6": "magenta", "#b5d65a": "lime", "#e5675b": "red", "#8b97ae": "muted" };
const TKEYS = new Set(Object.values(TCOL)), HEX = /^#[0-9a-f]{6}$/;

const hexOf = v => { v = String(v || "").trim().toLowerCase(); if (/^#[0-9a-f]{3}$/.test(v)) v = "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
  const m = v.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/); if (m) v = "#" + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, "0")).join(""); return HEX.test(v) ? v : ""; };
const CLEARC = "#010203"; // stand-in colour for "normal colour": becomes span[data-c="_def"] for a moment, then lift() takes the colour off
// numeric text sizes (toolbar size menu): span[data-s="18"]; the note's normal text is 15. Old notes keep s / n / l / xl.
const NSIZES = [8, 9, 10, 11, 12, 13, 14, 15, 16, 18, 20, 22, 24, 28, 32, 36, 40, 48, 60, 72];
// fonts (toolbar font menu): span[data-f="key"]; the first four are bundled with the app, the rest fall back to a close system font
const NFONTS = [["serif", "STIX Two Text"], ["sans", "IBM Plex Sans"], ["mono", "IBM Plex Mono"], ["cond", "Saira Semi Condensed"], ["georgia", "Georgia"], ["times", "Times New Roman"],
  ["palatino", "Palatino"], ["garamond", "Garamond"], ["arial", "Arial"], ["helvetica", "Helvetica"], ["verdana", "Verdana"], ["trebuchet", "Trebuchet MS"], ["tahoma", "Tahoma"],
  ["courier", "Courier New"], ["comic", "Comic Sans MS"], ["brush", "Brush Script MT"]];
const FKEYS = new Set(NFONTS.map(f => f[0]));
// text sizes from the toolbar (execCommand fontSize 2/3/5/6 → span[data-s=s|n|l|xl]); sizes are relative to the note's base size (--nb-base), so they never compound
const TSIZE = { "1": "s", "2": "s", "3": "n", "4": "l", "5": "l", "6": "xl", "7": "xl" }, SKEYS = new Set(["s", "n", "l", "xl", ...NSIZES.map(String)]);

<script>/* web/src/app.js */

  { k: "sheet", glyph: "𝄞", name: "Music chart", desc: "A blank lead sheet: bars, chords, melody", placeholder: "Untitled chart" }];
const attr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
async function newNote(o = {}){
  const NS = window.InquireNotes; if (!NS) return;
  const r = await askText({ title: "New note", label: "Note title", placeholder: "Untitled note", ok: "Create note", max: 140, kinds: NOTE_KINDS });
  if (r == null) return;
  const title = r.text || (r.kind === "code" ? "Untitled code" : r.kind === "sheet" ? "Untitled chart" : "Untitled note");
  const html = r.kind === "code" ? `<div class="nw" data-w="code" data-src="${attr(JSON.stringify({ lang: "python", title: r.text || "", src: "" }))}"></div><div><br></div>`
    : r.kind === "sheet" ? `<div class="nw" data-w="sheet" data-src="${attr(JSON.stringify(Object.assign({}, window.NPSheet ? NPSheet.DEF : {}, { title: r.text || "" })))}"></div><div><br></div>` : undefined;
  const n = NS.create({ title, html, folder: o.folder || null, fav: !!o.fav });
  NOTES.q = "";
  go({ view: "notes", sel: n.id, focusBody: r.kind === "code" ? "code" : r.kind === "sheet" ? "sheet" : true });
}
