.ng-dom{font:400 11.5px/1.2 var(--sans);color:var(--faint)}
.ng-facts dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font:400 12.5px/1.35 var(--sans)}
.ng-facts dt{color:var(--muted)} .ng-facts dd{margin:0;color:var(--text);font-family:var(--math)}
.ng-note{font:400 12px/1.4 var(--sans);color:var(--faint)} .ng-note:empty{display:none}
.ng-pts-h{font:600 9.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.ng-pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto}
.ng-pts li{display:flex;align-items:center;gap:8px;font:400 13px/1.3 var(--math);color:var(--text)}
.ng-pts b{color:var(--amber);font:600 12px/1 var(--sans);width:16px}
.ng-pts li span{flex:1}
.ng-pts button{all:unset;cursor:pointer;color:var(--faint);padding:2px 5px;font-size:11px}
.ng-pts button:hover{color:var(--red)}
.ng-add{display:flex;gap:5px}
.ng-in{flex:1;min-width:0;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 7px;font:400 12.5px/1.2 var(--mono);user-select:text}
.ng-in:focus{outline:none;border-color:var(--frame)} .ng-in.bad{border-color:var(--red)}
.nw[data-w="graph"] .nw-b.armed{color:var(--red);border-color:var(--red)}
@container (max-width:640px){ .ng-body{grid-template-columns:minmax(0,1fr)} .ng-plot{border-right:0;border-bottom:1px solid var(--line)} }

/* ---------- My notes as a page (#notes, renderNotesPage in app.js): no fog, no window over the menu ---------- */
.npage{height:100%;box-sizing:border-box;padding:14px 16px 16px;display:flex;flex-direction:column;overflow:hidden}
.np-win{flex:1;min-height:0;width:min(1440px,100%);margin:0 auto;display:flex;flex-direction:column}
.np-win .mw-body>.nb{flex:1;min-height:0;height:auto}
.np-newb{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:2px;
  font:700 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 82%,#fff),var(--frame));border:1px solid color-mix(in srgb,var(--frame) 70%,#fff);
  box-shadow:0 0 18px color-mix(in srgb,var(--frame) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:box-shadow .15s,filter .15s}
.np-newb:hover{filter:brightness(1.08);box-shadow:0 0 26px color-mix(in srgb,var(--frame) 65%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}
.np-newb:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:860px){ .npage{overflow:auto;padding:8px} .np-win{flex:none} .np-win .mw-body>.nb{flex:none} }
/* the note bar: ☆ on the left, the buttons on the right (no folder picker or "Saved": Devon, Oct 2026) */
.nb-bar .nb-bar-r{margin-left:auto}

/* folders column: every folder folds (▾/▸) and lists its notes under its folders */
.nb{--nb-fw:var(--nb-fw-user,200px)}
@media (max-width:1100px){ .nb{--nb-fw:var(--nb-fw-user,170px)} }
.nb-fnote{display:flex;align-items:center;gap:7px;padding:5px 8px 5px calc(10px + var(--d,1) * 14px);border-radius:2px;cursor:pointer;position:relative;
  font:400 12.5px/1.25 var(--sans);color:var(--muted);-webkit-user-drag:element}
.nb-fnote:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nb-fnote.sel{color:var(--text);background:linear-gradient(90deg,color-mix(in srgb,var(--frame) 12%,transparent),transparent)}
.nb-fnote.sel::before{content:"";position:absolute;left:calc(var(--d,1) * 14px);top:5px;bottom:5px;width:2px;background:var(--frame)}
.nb-fnote:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-fnote.dragging{opacity:.45}
.nb-fni{flex:none;width:12px;text-align:center;color:var(--faint);font-size:11px}
.nb-fnote .nb-fni:not(:empty){color:var(--faint)}
.nb-fnt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-fd.user .nb-fcar{color:var(--frame)}
.nb-rzf{position:absolute;z-index:5;top:0;bottom:0;left:var(--nb-fw);width:10px;transform:translateX(-50%);cursor:col-resize;touch-action:none;transition:left .32s cubic-bezier(.2,.7,.2,1)}
.nb-rzf::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s,box-shadow .15s}
.nb-rzf:hover::after,.nb.rz .nb-rzf::after,.nb-rzf:focus-visible::after{background:var(--frame);box-shadow:0 0 8px var(--frame)}
.nb-rzf:focus-visible{outline:none}
.nb.ffold .nb-rzf,.nb.rz .nb-rzf{transition:none}
.nb.ffold .nb-rzf{display:none}
@media (max-width:860px){ .nb-rzf{display:none} .nb-fnote{flex:0 0 auto;padding-left:8px} .nb-fnote.sel::before{left:0} }

/* editor: one note, or two side by side (.split); a minimised side note is a tab above (.nb-tabs) */
.nb-ed{display:flex;flex-direction:column;min-height:0;min-width:0}
.nb-panes{flex:1;min-height:0;display:flex}
.nb-pane{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column}
.nb-pane[hidden]{display:none}
.nb-pane.p2{border-left:1px solid var(--line);background:rgba(0,0,0,.08)}
.nb-p2h{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--line)}
.nb-p2tag{margin-right:auto;font:600 10.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--frame)}
.nb-p2b{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border:1px solid transparent;border-radius:2px;color:var(--muted);font-size:13px}
.nb-p2b:hover{color:var(--text);border-color:var(--line-2)}
.nb-p2b:focus-visible{outline:2px solid var(--frame)}
.nb-tabs{display:flex;gap:6px;padding:6px 10px 0;border-bottom:1px solid var(--line);background:rgba(0,0,0,.12)}
.nb-tabs[hidden]{display:none}
.nb-tab{display:flex;align-items:center;max-width:300px;border:1px solid var(--line-2);border-bottom:0;border-radius:3px 3px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--frame) 12%,var(--panel-2)),var(--panel-2));box-shadow:inset 0 2px 0 var(--frame)}
.nb-tab-t{all:unset;cursor:pointer;min-width:0;display:flex;gap:6px;align-items:center;padding:7px 10px;font:500 13px/1.2 var(--sans);color:var(--text)}
.nb-tab-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-tab-b{all:unset;cursor:pointer;padding:6px 8px;color:var(--muted);font-size:12px}
.nb-tab-t:focus-visible,.nb-tab-b:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nb-tab-b:hover{color:var(--text)}
.nb-trow{display:flex;align-items:center;gap:10px;padding-right:12px}
.nb-trow .nb-title{flex:1;min-width:0}
/* ⧉ drop spot: only while a note is being dragged */
.nb-split{display:none;align-items:center;gap:8px;padding:8px 12px;border:1px dashed var(--frame);border-radius:3px;color:var(--frame);font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;
  background:color-mix(in srgb,var(--frame) 10%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--frame) 30%,transparent);animation:np-pulse 1.4s ease-in-out infinite}
.nb-split-ic{font-size:16px;letter-spacing:0}
.nb.dragnote .p1 .nb-split{display:flex}
.nb.dragnote.dragself .p1 .nb-split{display:none}
.nb-split.over{background:color-mix(in srgb,var(--frame) 28%,transparent);color:var(--text);border-style:solid;box-shadow:0 0 24px color-mix(in srgb,var(--frame) 60%,transparent)}
@keyframes np-pulse{50%{box-shadow:0 0 4px color-mix(in srgb,var(--frame) 20%,transparent)}}
.nb.dragnote .nb-rich{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--frame) 35%,transparent)}
.nb-dcaret{position:fixed;z-index:2200;width:2px;background:var(--frame);box-shadow:0 0 8px var(--frame);pointer-events:none}
@media (max-width:860px){ .nb-panes{flex-direction:column} .nb-pane{flex:none;min-height:360px} .nb-pane.p2{border-left:0;border-top:1px solid var(--line)} .nb-split span:not(.nb-split-ic){display:none} }
@media (prefers-reduced-motion:reduce){ .nb-split{animation:none} }

/* starred folders: ★ stays lit and the folder sits at the top of its level */
.nb-fx.nb-ffav.on{opacity:1;color:var(--amber)}
.nb-fx.nb-ffav:hover{color:var(--amber)}

/* ↶ Undo / ↷ Redo in the My notes header */
.np-hist{display:inline-flex;gap:4px}
.np-hb{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 11px;border:1px solid var(--line-2);border-radius:2px;color:var(--muted);font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.18)}
.np-hb:hover:not(:disabled){color:var(--text);border-color:var(--frame)}
.np-hb:focus-visible{outline:2px solid var(--frame)}
.np-hb:disabled{opacity:.4;cursor:default}
@media (max-width:860px){ .np-hb{padding:8px 8px} }

/* lead sheet widget (notes-sheet.js) */
.nb-rich .nw[data-w="sheet"]{border-left-color:var(--magenta)}
.nw[data-w="sheet"] .nw-tag{color:var(--magenta);font-size:17px}
.nw .sh-comp{flex:0 1 150px;min-width:80px;text-transform:none;letter-spacing:0;font:400 12.5px/1.2 var(--sans)}
.nw-h select.sh-key,.nw-h select.sh-clef,.nw-h select.sh-time{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:3px 5px;font:400 12px/1.2 var(--sans)}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:12px 16px 0;min-height:10px}
.sh-t{grid-column:2;font:400 24px/1.2 var(--math);color:var(--text);text-align:center}
.sh-c{grid-column:3;justify-self:end;font:italic 400 13px/1.2 var(--math);color:var(--muted)}
.sh-staff{padding:2px 8px 6px;overflow-x:auto}
.sh-svg{width:100%;min-width:560px;height:auto}
.sh-svg .sh-bar{fill:transparent;cursor:pointer;stroke:none}
.sh-svg .sh-bar:hover{fill:color-mix(in srgb,var(--frame) 6%,transparent)}
.sh-svg .sh-bar.on{fill:color-mix(in srgb,var(--frame) 13%,transparent);stroke:color-mix(in srgb,var(--frame) 60%,transparent);stroke-width:1}
.sh-svg .sh-chord{font:600 16px/1 var(--math);fill:var(--text);pointer-events:none}
.sh-svg .sh-num{font:400 10px/1 var(--mono);fill:var(--faint);pointer-events:none}
.sh-svg .sh-over{font:600 9px/1 var(--ui);letter-spacing:.1em;fill:var(--red);text-transform:uppercase}
.sh-svg text,.sh-svg line,.sh-svg path,.sh-svg ellipse,.sh-svg circle{pointer-events:none}
.sh-barrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sh-barn{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--frame);min-width:96px;text-align:center}
.sh-chordl{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sh-chords,.sh-mel{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 8px;font:500 14px/1.2 var(--math);user-select:text}
.sh-chords{width:150px}.sh-mel{width:100%;box-sizing:border-box;font:400 12.5px/1.3 var(--mono)}
.sh-chords:focus,.sh-mel:focus{outline:none;border-color:var(--frame)}
.sh-sp{flex:1}
.sh-all summary{cursor:pointer;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.sh-all[open] summary{color:var(--text)}

/* right-click → Translate: the language box under the menu (textmenu.js) */
.tm-tr{margin-top:5px;padding:8px;border:1px solid color-mix(in srgb,var(--frame) 45%,var(--line-2));border-radius:3px;background:rgba(0,0,0,.22);display:grid;gap:8px;animation:vt-in .16s ease}
.tm-trh{font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.tm-langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.tm-menu .tm-lang{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 9px;border:1px solid var(--line-2);border-radius:2px;grid-template-columns:none}
.tm-menu .tm-lang b{font:600 12.5px/1.1 var(--sans)}
.tm-menu .tm-lang small{font-size:10.5px}
.tm-menu .tm-lang[aria-pressed="true"]{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 16%,transparent)}
.tm-trout:empty{display:none}
.tm-trtext{margin:0;font:400 14px/1.5 var(--sans);color:var(--text);max-height:180px;overflow:auto;user-select:text}
.tm-tr .tm-dacts{display:flex;flex-wrap:wrap;gap:14px}
.tm-tr .tm-dfoot{margin:0;font-size:11px;color:var(--faint)}

/* ---------- Note Office (office.js): a fogged window, the office canvas fills it ---------- */
.mw-win.mw-office{width:min(1500px,100%);height:calc(100dvh - 32px)}
.mw-office .mw-body{position:relative;display:flex;flex-direction:column}
.no-stage{position:relative;flex:1;min-height:0;overflow:hidden;border-top:1px solid var(--line);border-radius:0 0 3px 3px}
.no-stage canvas{display:block;width:100%;height:100%;touch-action:pan-y}
.no-bubble{position:absolute;pointer-events:none;white-space:nowrap;font:italic 16px/1.3 var(--math);color:var(--text);opacity:0;transition:opacity .25s}
.mw-office .no-status{font-style:italic}
.no-counts{font:500 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
@media (max-width:860px){ .mw-win.mw-office{height:calc(100dvh - 16px)} .no-counts{display:none} }
.npn-acts .slot.npn-office .glyph{color:var(--frame)}
.npn-acts .slot.npn-office{border-color:color-mix(in srgb,var(--frame) 40%,var(--line-2))}
/* the office canvas animates and covers the window: a backdrop blur behind it would be recomputed every frame for nothing */
.mw-win.mw-office{backdrop-filter:none;-webkit-backdrop-filter:none;background:linear-gradient(180deg,var(--panel-2),var(--panel))}
body.office-on #app{visibility:hidden}

/* ---------- My notes tabs (Devon, Oct 2026): thumb tabs on the right edge of the My notes window ----------
   Notes / Code / Music, coloured from Settings → Appearance → My notes tabs (--tab-*). Only the tabs take the colour. */
.np-wrap{flex:1;min-height:0;width:min(1488px,100%);margin:0 auto;display:flex;align-items:stretch}
.np-wrap .np-win{width:auto;flex:1;min-width:0;margin:0}
.np-thumbs{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:46px;margin-left:-1px;position:relative;z-index:1}
.np-thumb{all:unset;box-sizing:border-box;cursor:pointer;width:40px;padding:14px 0 12px;display:flex;flex-direction:column;align-items:center;gap:9px;position:relative;
  --tc:var(--tab-notes,#F2B84B);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);border-left-color:transparent;border-radius:0 6px 6px 0;
  background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 10%,var(--panel-2)),color-mix(in srgb,var(--tc) 22%,var(--panel-2)));color:color-mix(in srgb,var(--tc) 80%,var(--text));
  transition:background .15s,box-shadow .15s,width .15s,color .15s}
.np-thumb[data-sp="code"]{--tc:var(--tab-code,#4FA3F7)}
.np-thumb[data-sp="music"]{--tc:var(--tab-music,#D97AE6)}
.np-thg{font:600 13px/1 var(--mono);writing-mode:horizontal-tb}
.np-tht{writing-mode:vertical-rl;font:700 11px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase}
.np-ths{writing-mode:vertical-rl;font:500 9px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.np-thumb:hover{width:44px;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 18%,var(--panel-2)),color-mix(in srgb,var(--tc) 34%,var(--panel-2)))}
.np-thumb[aria-selected="true"]{width:46px;color:var(--ink);border-color:var(--tc);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 78%,#000),var(--tc));
  box-shadow:0 0 18px color-mix(in srgb,var(--tc) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.np-thumb[aria-disabled="true"]{cursor:default;opacity:.6}
.np-thumb[aria-disabled="true"]:hover{width:40px}
.np-thumb:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@media (max-width:860px){
  .np-wrap{flex:none;flex-direction:column-reverse}
  .np-thumbs{flex-direction:row;padding:0 0 0 10px;margin:0 0 -1px}
  .np-thumb{width:auto;flex-direction:row;padding:9px 14px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);border-bottom-color:transparent;border-radius:6px 6px 0 0}
  .np-thumb:hover,.np-thumb[aria-selected="true"],.np-thumb[aria-disabled="true"]:hover{width:auto}
  .np-tht,.np-ths{writing-mode:horizontal-tb}
}
@media (prefers-reduced-motion:reduce){ .np-thumb{transition:none} }
/* the title dialog with five kinds (code languages): the second row is centred */
.ask-kinds:has(> .ask-kind:nth-child(5):last-child){display:flex;flex-wrap:wrap;justify-content:center}
.ask-kinds:has(> .ask-kind:nth-child(5):last-child) > .ask-kind{flex:0 0 calc((100% - 16px) / 3)}
.ask-kinds .ask-kg{font-family:var(--mono);font-size:16px}
.ask-soon{margin:2px 0 10px;font:400 11.5px/1.45 var(--sans);color:var(--faint)}
.ask-soon b{color:var(--muted);font-weight:600}
@media (max-width:560px){ .ask-kinds:has(> .ask-kind:nth-child(5):last-child) > .ask-kind{flex-basis:calc((100% - 8px) / 2)} }

/* ---------- Code tab (code.js): bar · name · editor (Monaco) · Output / Input panel · status bar ---------- */
.nc-badge{display:inline-grid;place-items:center;min-width:26px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:3px;font:700 10px/1 var(--mono);letter-spacing:.04em;font-style:normal;
  --lc:var(--muted);color:var(--lc);border:1px solid color-mix(in srgb,var(--lc) 55%,transparent);background:color-mix(in srgb,var(--lc) 12%,transparent);flex:none}
.nc-badge[data-lang="python"],.nb-cfi[data-lang="python"]{--lc:#5CC8E0}
.nc-badge[data-lang="c"],.nb-cfi[data-lang="c"]{--lc:#8B97AE}
.nc-badge[data-lang="cpp"],.nb-cfi[data-lang="cpp"]{--lc:#B49BFF}
.nc-badge[data-lang="javascript"],.nb-cfi[data-lang="javascript"]{--lc:#B5D65A}
.nc-badge[data-lang="java"],.nb-cfi[data-lang="java"]{--lc:#F07CA0}
.nb-it .nb-t .nc-badge{margin-right:7px;height:16px;min-width:24px;font-size:9px;vertical-align:1px}
.nc-pane .nb-trow{padding-left:16px}
.nc-pane .nb-trow .nb-title{padding-left:0;font:500 20px/1.2 var(--mono)}
.nc-lang{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:5px 6px;font:500 12.5px/1.2 var(--sans)}
.nc-lang:focus-visible{outline:2px solid var(--frame)}
.nc-run{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:2px;font:700 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;
  color:#06210f;background:linear-gradient(180deg,#9be6ab,var(--green,#7BD88F));border:1px solid #9be6ab;box-shadow:0 0 12px rgba(123,216,143,.35)}
.nc-run:hover{filter:brightness(1.07)}
.nc-run:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.nc-run:disabled{cursor:progress;opacity:.7}
.nc-run.busy span{animation:nc-spin 1s linear infinite;display:inline-block}
@keyframes nc-spin{to{transform:rotate(360deg)}}
.nc-edhost{flex:1;min-height:220px;position:relative;margin:4px 0 0;border-top:1px solid var(--line);background:var(--ink)}
.nc-edhost>.monaco-editor{position:absolute!important;inset:0}
.nc-loading{padding:16px;font:400 12.5px/1 var(--mono);color:var(--faint)}
.nc-plain{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);font:400 13.5px/21px var(--mono)}
.nc-gut{overflow:hidden;padding:10px 10px 10px 14px;text-align:right;color:var(--faint);user-select:none;border-right:1px solid var(--line)}
.nc-gut span{display:block}
.nc-ta{all:unset;box-sizing:border-box;width:100%;height:100%;padding:10px 12px;white-space:pre;overflow:auto;color:var(--text);font:inherit;tab-size:4;caret-color:var(--frame)}
.nc-panel{flex:none;display:flex;flex-direction:column;height:168px;border-top:1px solid var(--line-2);background:rgba(0,0,0,.22)}
.nc-panel[data-open="0"]{height:auto}
.nc-panel[data-open="0"] .nc-out,.nc-panel[data-open="0"] .nc-in{display:none}
.nc-ptabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
.nc-pt{all:unset;cursor:pointer;padding:8px 10px 7px;font:600 10.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);border-bottom:2px solid transparent}
.nc-pt[aria-selected="true"]{color:var(--text);border-bottom-color:var(--frame)}
.nc-pt:focus-visible,.nc-pb:focus-visible{outline:2px solid var(--frame);outline-offset:-2px}
.nc-pst{margin-left:auto;font-size:12px;color:var(--faint)}
.nc-pst.ok{color:var(--green)} .nc-pst.bad{color:var(--red)}
.nc-pb{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.nc-pb:hover{color:var(--text)}
.nc-out{flex:1;min-height:0;margin:0;padding:8px 14px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:400 12.5px/1.55 var(--mono);color:var(--text)}
.nc-out[hidden],.nc-in[hidden]{display:none}
.nc-o-err,.nc-o-bad{color:var(--red)} .nc-o-dim{color:var(--faint)} .nc-o-ok{color:var(--green)}
.nc-in{flex:1;min-height:0;resize:none;margin:0;border:0;padding:8px 14px;background:transparent;color:var(--text);font:400 12.5px/1.55 var(--mono)}
.nc-in:focus{outline:none;box-shadow:inset 2px 0 0 var(--frame)}
.nc-status{flex:none;display:flex;gap:16px;align-items:center;padding:5px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);overflow:hidden;white-space:nowrap}
.nc-status .nc-s-lang{color:var(--frame)}
.nc-status .nc-s-run{margin-left:auto}
.nb-p2body{flex:1;min-height:0;display:flex;flex-direction:column}
.nb-p2body .nc-panel{height:120px}
.nc-trpop{position:fixed;z-index:2300;min-width:230px;max-width:280px;padding:8px;display:flex;flex-direction:column;gap:2px}
.nc-trpop button{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:2px;font:500 13px/1.2 var(--sans);color:var(--text)}
.nc-trpop button:hover,.nc-trpop button:focus-visible{background:color-mix(in srgb,var(--frame) 14%,transparent)}
.nc-trh{margin:2px 6px 6px;font:600 10px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.nc-trnote{margin:6px 6px 2px;font:400 11px/1.4 var(--sans);color:var(--faint)}
@media (max-width:860px){ .nc-edhost{min-height:320px} .nc-status span:nth-child(3),.nc-status span:nth-child(4){display:none} }
@media (prefers-reduced-motion:reduce){ .nc-run.busy span{animation:none} }

/* Notes tab: the Code section under the folders (a divider, then the Code folders and their files) */
.nb-codeh{display:flex;align-items:center;gap:6px;margin:12px 4px 4px;padding:8px 4px 4px;border-top:1px solid color-mix(in srgb,var(--tab-code,#4FA3F7) 45%,var(--line))}
.nb-codet{all:unset;cursor:pointer;flex:1;font:600 10px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in srgb,var(--tab-code,#4FA3F7) 75%,var(--text))}
.nb-codet:focus-visible,.nb-codego:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nb-codego{all:unset;cursor:pointer;padding:2px 5px;color:var(--faint);font-size:12px}
.nb-codego:hover{color:var(--text)}
.nb-cfd{display:flex;align-items:center;gap:4px;padding:4px 8px 4px calc(2px + var(--d,0) * 14px);font:500 12.5px/1.2 var(--sans);color:var(--muted)}
.nb-cfd .nb-cfdn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-cfd .nb-fcar{color:color-mix(in srgb,var(--tab-code,#4FA3F7) 75%,var(--text))}
.nb-cfile{padding-left:calc(10px + var(--d,0) * 14px)}
.nb-cfi.nb-fni{width:auto;min-width:22px;height:15px;display:inline-grid;place-items:center;border-radius:2px;font:700 8.5px/1 var(--mono);--lc:var(--muted);color:var(--lc)!important;border:1px solid color-mix(in srgb,var(--lc) 50%,transparent)}
.nb-codeempty{margin:4px 8px;font:400 12px/1.4 var(--sans);color:var(--faint)}
.nb.dragcode .nb-rich{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tab-code,#4FA3F7) 55%,transparent)}
@media (max-width:860px){ .nb-codeh{flex:0 0 100%;margin:4px 0 0} .nb-codetree{display:flex;flex-wrap:wrap;flex:0 0 100%} .nb-cfd{display:none} .nb-cfile{flex:0 0 auto;padding-left:8px} }

/* ---------- My Tasks (tasks.js, #tasks): list on the left, the task's overview on the right ---------- */
.npn-acts .slot.npn-tasks .glyph{color:var(--frame)}
.npn-acts .slot .tag.od{color:var(--red)}
.tpage .nt-win{width:min(1440px,100%)}
.nt{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);flex:1;min-height:0;height:clamp(460px,68vh,780px)}
.np-win .mw-body>.nt{flex:1;min-height:0;height:auto}
.nt-list{min-height:0}
.nt-sum{padding:7px 14px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.nt-sum:empty{display:none}
.nt-od{color:var(--red);font-weight:600}
.nt-it{flex-direction:row;align-items:center;gap:10px;padding:10px 12px 10px 14px}
.nt-it::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--pc)}
.nt-it[data-pri="high"],.nt-head[data-pri="high"]{--pc:#E5675B}
.nt-it[data-pri="med"],.nt-head[data-pri="med"]{--pc:#F2B84B}
.nt-it[data-pri="low"],.nt-head[data-pri="low"]{--pc:#5CC8E0}
.nt-it.done .nb-t{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 70%,transparent)}
.nt-it.done::after{opacity:.35}
.nt-itx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nt-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font:500 11px/1.2 var(--sans);color:var(--faint)}
.nt-meta:empty{display:none}
.nt-due{color:var(--muted)} .nt-due.soon{color:var(--amber)} .nt-due.od{color:var(--red);font-weight:600}
.nt-pri{font-style:normal;font-size:.8em;margin-right:6px;vertical-align:1px}
.nt-pri[data-pri="high"]{color:#E5675B} .nt-pri[data-pri="med"]{color:#F2B84B} .nt-pri[data-pri="low"]{color:#5CC8E0}
.nt-ck{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--pc,var(--muted)) 75%,var(--line-2));display:grid;place-items:center;transition:background .15s,border-color .15s}
.nt-ck::after{content:"✓";font:700 12px/1 var(--sans);color:var(--ink);opacity:0}
.nt-ck:hover{background:color-mix(in srgb,var(--green) 18%,transparent);border-color:var(--green)}
.nt-ck[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.nt-ck[aria-checked="true"]::after{opacity:1}
.nt-ck:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nt-ck.big{width:26px;height:26px}
.nt-ck.big::after{font-size:15px}
.nt-thumb{flex:none;width:34px;height:34px;border-radius:6px;background:var(--panel-2) center/cover no-repeat;border:1px solid var(--line-2)}
.nt-ed{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.nt-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 9%,transparent),transparent 55%)}
.nt-pic{all:unset;box-sizing:border-box;cursor:pointer;width:96px;height:96px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--panel-2) center/cover no-repeat;border:2px solid color-mix(in srgb,var(--pc) 70%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--pc) 25%,transparent);color:var(--pc);text-align:center}
.nt-pic span{font-size:26px;line-height:1}
.nt-pic small{font:600 9px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.nt-pic:hover,.nt-pic.over{border-color:var(--pc);filter:brightness(1.08)}
.nt-pic:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.nt-hx{min-width:0;display:flex;flex-direction:column;gap:10px}
.nt-trow{display:flex;align-items:center;gap:12px}
.nt-title.nb-title{flex:1;min-width:0;padding:0;font-size:24px}
.nt-pris{display:flex;gap:6px;flex-wrap:wrap}
.nt-prib{all:unset;cursor:pointer;display:inline-flex;align-items:center;padding:6px 11px;border:1px solid var(--line-2);border-radius:2px;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nt-prib:hover{color:var(--text)}
.nt-prib[aria-checked="true"]{color:var(--text);border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.nt-prib:focus-visible,.nt-chip:focus-visible,.nt-seg button:focus-visible{outline:2px solid var(--frame);outline-offset:1px}
.nt-donel{margin:0;font:500 12px/1 var(--sans);color:var(--green)}
.nt-hb{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.nt-hb .btn-s:disabled{opacity:.45;cursor:default}
.nt-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 18px 20px;align-content:start}
.nt-card{border:1px solid var(--line);border-radius:3px;background:rgba(0,0,0,.14);padding:12px 14px 14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.nt-card h3{margin:0;font:600 10.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);display:flex;gap:8px}
.nt-wide{grid-column:1 / -1}
.nt-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.nt-row label{display:flex;flex-direction:column;gap:5px;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.nt-in{background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:7px 9px;font:400 13px/1.2 var(--sans);color-scheme:dark;min-width:0}
.nt-in:focus{outline:none;border-color:var(--frame)}
.nt-in:disabled{opacity:.5}
.nt-cn{width:64px}
.nt-locq{flex:1}
.nt-when{margin:0;font:500 13px/1.3 var(--sans);color:var(--text)} .nt-when.od{color:var(--red)}
.nt-hint{margin:0;font:400 12px/1.4 var(--sans);color:var(--faint)} .nt-bad{color:var(--red)}
.nt-seg{display:flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden;align-self:flex-start;flex-wrap:wrap}
.nt-seg button{all:unset;cursor:pointer;padding:7px 11px;font:500 12px/1 var(--sans);color:var(--muted)}
.nt-seg button+button{border-left:1px solid var(--line-2)}
.nt-seg button[aria-checked="true"]{color:var(--ink);background:var(--frame)}
.nt-chips{display:flex;flex-wrap:wrap;gap:6px}
.nt-chip{all:unset;cursor:pointer;padding:6px 10px;border:1px solid var(--line-2);border-radius:14px;font:500 12px/1 var(--sans);color:var(--muted)}
.nt-chip[aria-pressed="true"]{color:var(--text);border-color:var(--frame);background:color-mix(in srgb,var(--frame) 16%,transparent)}
.nt-chip:disabled{opacity:.45;cursor:default}
.nt-locked{display:flex;align-items:center;gap:10px}
.nt-lock{flex:none;padding:4px 7px;border:1px solid var(--green);border-radius:2px;font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.nt-loclabel{flex:1;min-width:0;font:500 13px/1.35 var(--sans);color:var(--text)}
.nt-map{position:relative;height:190px;overflow:hidden;border:1px solid var(--line-2);border-radius:3px;background:#1a2230}
.nt-tiles img{position:absolute;width:256px;height:256px;max-width:none;filter:saturate(.85) brightness(.92);user-select:none}
.nt-map .nt-pin{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-18px 0 0 -9px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.nt-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:2px}
.nt-zoom button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;background:rgba(7,10,16,.8);color:var(--text);border:1px solid var(--line-2);border-radius:2px;font-size:14px}
.nt-attr{position:absolute;right:0;bottom:0;padding:2px 6px;background:rgba(255,255,255,.75);color:#333;font:400 10px/1.3 var(--sans)}
.nt-attr a{color:#245}
.nt-maplinks{margin:0;font:500 12px/1 var(--sans)} .nt-maplinks a{color:var(--frame)}
.nt-locres{display:flex;flex-direction:column;gap:2px}
.nt-locres:empty{display:none}
.nt-lr{all:unset;cursor:pointer;display:flex;gap:8px;padding:7px 9px;border-radius:2px;font:400 12.5px/1.35 var(--sans);color:var(--text)}
.nt-lr:hover,.nt-lr:focus-visible{background:color-mix(in srgb,var(--frame) 14%,transparent)}
.nt-lrp{color:var(--frame)}
.nt-notes{width:100%;box-sizing:border-box;resize:vertical;min-height:84px;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:9px 11px;font:400 14px/1.5 var(--sans)}
.nt-notes:focus{outline:none;border-color:var(--frame)}
.nt-drop{cursor:pointer;padding:16px;border:1px dashed var(--line-2);border-radius:3px;text-align:center;font:400 12.5px/1.4 var(--sans);color:var(--faint)}
.nt-drop b{color:var(--frame);font-weight:600}
.nt-drop:hover,.nt-drop.over,.nt-drop:focus-visible{border-color:var(--frame);color:var(--text);background:color-mix(in srgb,var(--frame) 8%,transparent);outline:none}
.nt-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.nt-gi{position:relative;aspect-ratio:4/3;border-radius:3px;overflow:hidden;border:1px solid var(--line-2);cursor:zoom-in;background:var(--panel-2)}
.nt-gi video,.nt-gimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:center/cover no-repeat}
.nt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.nt-fn{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font:400 10.5px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt-fx{all:unset;cursor:pointer;position:absolute;right:4px;top:4px;width:20px;height:20px;display:grid;place-items:center;border-radius:2px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;opacity:0}
.nt-gi:hover .nt-fx,.nt-fx:focus-visible{opacity:1}
.nt-docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.nt-docs li{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;font-size:12px;color:var(--faint)}
.nt-docs .nt-fx{position:static;opacity:1;background:none;color:var(--muted)}
.nt-ext{flex:none;min-width:34px;text-align:center;padding:3px 4px;border-radius:2px;font:700 9px/1 var(--mono);color:var(--frame);border:1px solid color-mix(in srgb,var(--frame) 50%,transparent)}
.nt-dn{all:unset;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 13px/1.2 var(--sans);color:var(--text)}
.nt-dn:hover{color:var(--frame);text-decoration:underline}
.nt-lb{position:fixed;inset:0;z-index:2400;background:rgba(3,5,9,.86);display:grid;place-items:center;padding:40px}
.nt-lb img,.nt-lb video{max-width:100%;max-height:calc(100vh - 100px);border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.nt-lbx{all:unset;cursor:pointer;position:absolute;right:20px;top:16px;width:36px;height:36px;display:grid;place-items:center;color:#fff;font-size:18px;border:1px solid rgba(255,255,255,.3);border-radius:2px}
.nt-lbn{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#ddd;font:400 13px/1 var(--sans)}
@media (max-width:1100px){ .nt-body{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .nt{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto}
  .nt-list{border-right:0;border-bottom:1px solid var(--line);max-height:340px}
  .nt-head{grid-template-columns:auto minmax(0,1fr);padding:14px}
  .nt-hb{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap}
  .nt-pic{width:72px;height:72px}
  .nt-title.nb-title{font-size:20px}
  .nt-body{padding:12px}
}

/* ---------- My notes › ⇅ Import / Export (io.js) ---------- */
.np-io{margin-right:2px}
.io-win{width:min(1120px,100%);height:min(800px,calc(100dvh - 32px))}
.io{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:auto}
.io-col{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.io-col+.io-col{border-left:1px solid var(--line)}
.io-h{margin:0;font:600 11px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--frame)}
.io-scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.io-scope button,.io-fmt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line-2);border-radius:3px;background:rgba(0,0,0,.16);min-width:0}
.io-scope b,.io-fmt b{font:600 13px/1.2 var(--sans);color:var(--text)}
.io-scope small,.io-fmt small{font:400 11.5px/1.35 var(--sans);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.io-scope button:disabled{opacity:.45;cursor:default}
.io-scope button[aria-checked="true"],.io-fmt[aria-checked="true"]{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 13%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--frame) 25%,transparent)}
.io-scope button:focus-visible,.io-fmt:focus-visible,.io-drop:focus-visible{outline:2px solid var(--frame);outline-offset:2px}
.io-fmts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.io-fmt{position:relative;padding-right:56px}
.io-ext{position:absolute;right:10px;top:10px;font:700 10px/1 var(--mono);color:var(--frame);padding:3px 5px;border:1px solid color-mix(in srgb,var(--frame) 50%,transparent);border-radius:2px}
.io-fmt .io-for{color:var(--text);opacity:.8}
.io-go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.io-msg,.io-log{margin:0;font:400 12.5px/1.45 var(--sans);color:var(--muted)}
.io-msg.ok,.io-log.ok{color:var(--green)} .io-msg.bad,.io-log.bad{color:var(--red)}
.io-skip{color:var(--faint)}
.io-drop{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:1px dashed var(--line-2);border-radius:4px;text-align:center;font:500 13.5px/1.4 var(--sans);color:var(--text)}
.io-drop small{color:var(--faint)}
.io-drop:hover,.io-drop.over{border-color:var(--frame);background:color-mix(in srgb,var(--frame) 8%,transparent)}
.io-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.io-into{display:flex;align-items:center;gap:10px;font:600 10.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.io-sel{flex:1;min-width:0;background:var(--ink);color:var(--text);border:1px solid var(--line-2);border-radius:2px;padding:6px 8px;font:400 13px/1.2 var(--sans);text-transform:none;letter-spacing:0}
.io-works{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:5px;font:400 12.5px/1.45 var(--sans);color:var(--muted)}
.io-works b{color:var(--text);font-weight:600}
.io-works .io-soon{color:var(--faint);list-style:"◇ "}

/* ‹ Back to the Main Menu: first thing in the header of My notes, My Tasks and Note Office (Devon, Oct 2026) */

<script>/* web/lib/python-tokens.js */
/* ============ Subject kit: Computer Science (Programming Fundamentals onward) ============
   Every program a lab shows is REAL Python: write it in web/cs-src/<topic-id>.py and run
   `python3 tools/pytrace.py <topic-id>`; that records each step CPython takes into web/traces/<topic-id>.js
   (window.CSTraces["<id>/<program>"]). Labs only play traces back, so a lab can never disagree with Python.
   Two layers:
   1. window.CSRules (CR): pure, DOM-free rules, tested in tests/cs.test.js (node tools/labtest.js cs):
      tokens(line) Python highlighting · show(val, heap) Python-style display text · frames/out/changed per step ·
      watch(trace, name) a variable's value at every step · bits (toBase, fromBase, twos, fromTwos, utf8) · shuffle(arr, seed).
   2. window.CSKit.attach(k): k.trace(cfg) the whole Trace / Memory / Array lab in one call, k.predict(cfg) predict-then-run,
      k.bits(cfg) bit board, k.csModes(list, build) mode switching, k.guard(list), k.csro(o) standard readout.
   House colour keys for every CS page (the legend must use them): c1 amber = line about to run, c2 cyan = variable that
   just changed, c3 pink = output, c4 violet = references / objects, c5 green = return values. */
(function(){
const W = window;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------------- 1. CSRules ---------------- */
const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const BI = new Set("print input int float str bool len range list dict set tuple sum min max abs round sorted enumerate zip type isinstance open map filter reversed any all chr ord".split(" "));
function tokens(line){
  const out = []; let i = 0;
  const push = (t, s) => { if (s) out.push({ t, s }); };
  while (i < line.length) {
    const r = line.slice(i);
    let m;
    if ((m = r.match(/^#.*/))) { push("com", m[0]); break; }
    if ((m = r.match(/^[rRbBfF]{0,2}("""|'''|"(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?)/)) && (m[1] !== '"""' && m[1] !== "'''" || true)) { push("str", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^\d+(\.\d*)?([eE][+-]?\d+)?j?|^\.\d+/))) { push("num", m[0]); i += m[0].length; continue; }
    if ((m = r.match(/^[A-Za-z_]\w*/))) { const w = m[0]; push(KW.has(w) ? "kw" : BI.has(w) ? "bi" : "name", w); i += w.length; continue; }
    if ((m = r.match(/^\s+/))) { push("ws", m[0]); i += m[0].length; continue; }
    push("op", line[i]); i++;
  }
  // merge neighbouring ops/ws so the HTML stays small
  return out.reduce((a, x) => { const l = a[a.length - 1]; if (l && l.t === x.t && (x.t === "op" || x.t === "ws")) l.s += x.s; else a.push({ ...x }); return a; }, []);
}

// Display text for a traced value, Python style. Cycles show as [...].
function show(v, heap, seen = new Set()){
  if (!v) return "";
  const [kind, x] = v;
  if (kind === "v") return x;
  if (kind === "fn") return `function ${x}`;
  if (kind === "cls") return `class ${x}`;
  const o = heap[x]; if (!o) return "…";
  if (o.t === "val") return o.v;
  if (seen.has(x)) return o.t === "dict" ? "{...}" : "[...]";
  const s2 = new Set(seen); s2.add(x);
  const items = o.t === "dict" || o.t === "obj" ? null : o.v.map(e => show(e, heap, s2));
  if (o.t === "list") return `[${items.join(", ")}]`;
  if (o.t === "tuple") return items.length === 1 ? `(${items[0]},)` : `(${items.join(", ")})`;
  if (o.t === "set") return items.length ? `{${items.join(", ")}}` : "set()";
  if (o.t === "dict") return `{${o.v.map(([a, b]) => show(a, heap, s2) + ": " + show(b, heap, s2)).join(", ")}}`;
  return `${o.c}(${o.v.map(([a, b]) => a + "=" + show(b, heap, s2)).join(", ")})`;
}

const stepAt = (T, i) => T.steps[Math.max(0, Math.min(T.steps.length - 1, i))];
const outAt = (T, i) => T.out.slice(0, stepAt(T, i).o);
// How many times line `line` has started running in steps 0…i (loop passes: give the first line of the body).
const hits = (T, i, line) => T.steps.slice(0, Math.max(0, i) + 1).filter(s => s.ev === "line" && s.l === line).length;
// Names whose shown value differs from the step before: Set of "depth:name" (depth 0 = global frame).
function changed(T, i){
  const res = new Set(); if (i <= 0) return res;
  const a = stepAt(T, i - 1), b = stepAt(T, i);
  b.f.forEach((fr, d) => {
    const pf = a.f[d] && a.f[d].fn === fr.fn ? a.f[d] : null;
    for (const [n, v] of Object.entries(fr.vars)) if (!pf || !(n in pf.vars) || show(pf.vars[n], a.h) !== show(v, b.h)) res.add(d + ":" + n);
  });
  return res;
}
// A global (or innermost-frame, inner: true) variable's shown value at every step; undefined before it exists.
const watch = (T, name, inner) => T.steps.map(s => { const fr = inner ? s.f[s.f.length - 1] : s.f[0]; return fr && name in fr.vars ? show(fr.vars[name], s.h) : undefined; });
// Python list of numbers at step i as a JS array (for the array view), or null.
function nums(T, i, name){
  const s = stepAt(T, i); const fr = s.f.find(f => name in f.vars) ; const v = fr && fr.vars[name];
  if (!v || v[0] !== "r" || !s.h[v[1]] || s.h[v[1]].t !== "list") return null;
  return s.h[v[1]].v.map(e => (e[0] === "v" ? Number(e[1]) : NaN));
}
const evText = (T, i) => { const s = stepAt(T, i), fn = s.f.length ? s.f[s.f.length - 1].fn : "";
  return s.ev === "end" ? "program finished" : s.ev === "call" ? `calling ${fn}()` : s.ev === "return" ? `${fn}() returns ${show(s.r, s.h)}` : s.ev === "exc" ? "an exception is raised" : `about to run line ${s.l}`; };

// Bits. toBase(13, 2, 8) = "00001101"; fromBase("ff", 16) = 255; twos(-3, 8) = "11111101"; fromTwos("11111101") = -3.
const toBase = (n, b, w = 0) => { if (!Number.isInteger(n) || n < 0) throw new Error("CSRules.toBase: needs a whole number ≥ 0 (use twos for negatives)"); return n.toString(b).toUpperCase().padStart(w, "0"); };
const fromBase = (s, b) => { const v = parseInt(String(s).replace(/_/g, ""), b); if (!Number.isFinite(v)) throw new Error(`CSRules.fromBase: "${s}" is not base ${b}`); return v; };
const twos = (n, w) => { const lo = -(2 ** (w - 1)), hi = 2 ** (w - 1) - 1; if (n < lo || n > hi) throw new Error(`CSRules.twos: ${n} does not fit in ${w} bits (${lo}…${hi})`); return toBase(n < 0 ? 2 ** w + n : n, 2, w); };
const fromTwos = bits => { const w = bits.length, u = fromBase(bits, 2); return bits[0] === "1" ? u - 2 ** w : u; };
const utf8 = ch => { const c = ch.codePointAt(0); if (c < 0x80) return [c]; if (c < 0x800) return [0xC0 | c >> 6, 0x80 | c & 63];
  if (c < 0x10000) return [0xE0 | c >> 12, 0x80 | c >> 6 & 63, 0x80 | c & 63]; return [0xF0 | c >> 18, 0x80 | c >> 12 & 63, 0x80 | c >> 6 & 63, 0x80 | c & 63]; };
const shuffle = (arr, seed) => { const a = arr.slice(); let s = seed == null ? null : seed;
  const rnd = () => { if (s == null) return Math.random(); s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CR = W.CSRules = { tokens, show, stepAt, outAt, hits, changed, watch, nums, evText, toBase, fromBase, twos, fromTwos, utf8, shuffle, esc };
})();

</script>
<script>/* web/lib/music-theory.js */
/* ============ Subject kit: Music ============
   Two layers, so labs only write what is unique to their topic:
   1. window.MusicTheory (MT): pure, DOM-free rules: pitch spelling, MIDI and frequency, intervals,
      transposition, scales, key signatures, clef positions, exact rhythm values, meters, harmonics.
      Tested in tests/music.test.js (node tools/labtest.js music). Put any new rule a lab needs HERE, with a test.
   2. window.MusicKit.attach(k): drawing and sound on top of the lab kit `k` (web/kits/universal/core.js):
      staff with vector clefs, notes, rests, accidentals, time and key signatures, beams, a piano keyboard,
      and a small Web Audio synth (never autoplays; sound starts only from a button or a key press).
   API summary is in web/WRITER-PACK-MUSIC.md. */
(function(){
const W = window;

/* ---------------- 1. MusicTheory: rules ---------------- */
const LET = "CDEFGAB", NAT = [0, 2, 4, 5, 7, 9, 11];
const ACC_U = { "-2": "𝄫", "-1": "♭", "0": "", "1": "♯", "2": "𝄪" }, ACC_A = { "-2": "bb", "-1": "b", "0": "", "1": "#", "2": "x" };
const mod = (a, n) => ((a % n) + n) % n;

// Exact rationals for rhythm (durations in whole notes).
function R(n, d = 1){ if (d < 0) { n = -n; d = -d; } const g = gcdI(Math.abs(n), d) || 1; return Object.freeze({ n: n / g, d: d / g, add: o => R(n * o.d + o.n * d, d * o.d), sub: o => R(n * o.d - o.n * d, d * o.d), mul: o => R(n * o.n, d * o.d), div: o => R(n * o.d, d * o.n), eq: o => n * o.d === o.n * d, lt: o => n * o.d < o.n * d, val: n / d, toString: () => d / g === 1 ? String(n / g) : `${n / g}/${d / g}` }); }
function gcdI(a, b){ while (b) [a, b] = [b, a % b]; return a; }

function parse(s){
  if (typeof s === "object") return s;
  const m = String(s).trim().match(/^([A-Ga-g])(𝄪|𝄫|♯|♭|♮|##|bb|#|b|x|n)?(-?\d+)?$/);
  if (!m) throw new Error(`MusicTheory.parse: "${s}" is not a pitch like C4, F#3, Bb5`);
  const a = { "𝄪": 2, "x": 2, "##": 2, "♯": 1, "#": 1, "♭": -1, "b": -1, "𝄫": -2, "bb": -2, "♮": 0, "n": 0 }[m[2] || ""] || 0;
  return { l: LET.indexOf(m[1].toUpperCase()), a, o: m[3] === undefined ? 4 : +m[3] };
}
const accSym = (a, ascii) => (ascii ? ACC_A : ACC_U)[a] ?? (a > 0 ? "♯".repeat(a) : "♭".repeat(-a));
const name = (p, o = {}) => { p = parse(p); return LET[p.l] + accSym(p.a, o.ascii) + (o.octave === false ? "" : p.o); };
const midi = p => { p = parse(p); return 12 * (p.o + 1) + NAT[p.l] + p.a; };
const pc = p => mod(midi(p), 12);
const dia = p => { p = parse(p); return p.o * 7 + p.l; };            // diatonic step number (letter + octave)
const freq = (p, a4 = 440) => a4 * Math.pow(2, ((typeof p === "number" ? p : midi(p)) - 69) / 12);
const fromDia = (d, a = 0) => ({ l: mod(d, 7), a, o: Math.floor(d / 7) });
// All reasonable spellings (accidentals −2…+2) of a MIDI note, simplest first.
function spellings(m){ const out = []; for (let l = 0; l < 7; l++) for (const a of [0, 1, -1, 2, -2]) { const base = NAT[l] + a, o = Math.floor((m - base) / 12) - 1; if (12 * (o + 1) + base === m) out.push({ l, a, o }); } return out.sort((x, y) => Math.abs(x.a) - Math.abs(y.a)); }
// Default spelling for a key on the keyboard: naturals, else sharp (flats if prefer < 0).
const fromMidi = (m, prefer = 1) => { const s = spellings(m); return s.find(x => x.a === 0) || s.find(x => Math.sign(x.a) === Math.sign(prefer) && Math.abs(x.a) === 1) || s[0]; };

const SIZE = ["unison", "second", "third", "fourth", "fifth", "sixth", "seventh", "octave", "ninth", "tenth", "eleventh", "twelfth", "thirteenth", "fourteenth", "double octave"];
const PERFECT = s => [1, 4, 5].includes(s);
const QLONG = { P: "perfect", M: "major", m: "minor", A: "augmented", d: "diminished", AA: "doubly augmented", dd: "doubly diminished" };
// Interval from p up to q (q must not be below p in letter+octave).
function interval(p, q){
  const size = dia(q) - dia(p) + 1;

      const mk = o.create ? o.create(q.value.trim()) : null;

<script>/* web/src/code.js */

    const key = ev => { if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); close(); b.focus(); } };
    document.addEventListener("pointerdown", away, true); document.addEventListener("keydown", key, true);

  };
  async function doTranslate(to) {
    flush(); tab("out"); out.innerHTML = "";
    const s = await ai.status();
    if (!s || !s.configured) { put("err", "AI translation is not set up in this copy of NotePath yet. Once the AI key is installed (see Settings → Code), ⇄ Translate turns this file into " + L(to).name + ".\n"); if (o.msg) o.msg("AI translation is not set up yet"); return; }
    put("dim", `⇄ Translating into ${L(to).name}…\n`);
    try {
      const src2 = await translate(ed.getValue(), code.lang, to);
      const m = NS.create({ title: (ti.value.trim() || "Untitled code").replace(/\.[a-z+]+$/i, "") + " (" + L(to).name + ")", folder: NS.get(n.id) ? NS.get(n.id).folder : null, code: { lang: to, src: src2 } });
      put("ok", `■ Done: “${m.title}” opens beside this file.\n`);
      if (o.openSide) o.openSide(m.id);
    } catch (e2) { put("err", (e2 && e2.message || "Translation failed") + "\n"); }
  }
  // Save file: the code as main.py / main.c / Main.java …
  q('[data-a="dl"]').onclick = () => {
    flush(); const l = L(code.lang), base = l.k === "java" ? "Main" : (ti.value.trim().replace(/\.[a-z+]+$/i, "").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "_") || "main");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ed.getValue()], { type: "text/plain" })); a.download = base + "." + l.ext;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  if (o.main) {
    q('[data-a="fav"]').onclick = e => { const m = NS.update(n.id, { fav: !NS.get(n.id).fav, quiet: true }); const b = e.currentTarget; b.classList.toggle("on", m.fav); b.textContent = m.fav ? "★" : "☆"; b.setAttribute("aria-pressed", String(m.fav)); b.title = m.fav ? "Remove from favourites" : "Add to favourites"; if (o.onFav) o.onFav(); };
    q('[data-a="del"]').onclick = () => { if (o.onDelete) o.onDelete(); };
  }
  const onCfg = () => paintLang(); window.addEventListener("np:code-settings", onCfg);
  if (o.focus) ed.onReady(() => ed.focus());
  return { id: n.id, flush, focus: () => ed.focus(), editor: ed, run: doRun,
    destroy: () => { flush(); ed.destroy(); window.removeEventListener("np:code-settings", onCfg); document.querySelectorAll(".nc-trpop").forEach(x => x.remove()); } };
}

window.NPCode = { LANGS, SOON, lang: L, SERVICES, settings, setSettings, run, ai, translate, pane, editor, loadMonaco, langSelect };
})();

</script>
<script>/* web/src/tasks.js */
/* My Tasks (NotePath, Oct 2026): Main Menu → My Tasks, a page like My notes (#tasks). window.NPTasks.
   Left: the list of tasks (the notes-list look) with priority, done box, due date, repeat, reminders, place and picture.
   Right: everything about the selected task, all editable: picture ("profile" photo), name, done, priority (High ▲ red,
   Medium ◆ amber, Low ● cyan), due date and time, repeat (daily / weekly), reminders, place (checked with OpenStreetMap
   and locked onto a map), notes, and files / photos / videos.
   Store: localStorage "notepath.tasks._local" = [{ id, title, done, doneAt, pri: "high"|"med"|"low", dueDate "YYYY-MM-DD"|"",
     dueTime "HH:MM"|"", repeat: "none"|"daily"|"weekly", rem: [minutes before], loc: null|{ q, label, lat, lon },
     notes, files: [{ id, name, type, size }], pic: media id|null, created, updated, last (last done of a repeating task) }].
   Pictures and files live in the notes' IndexedDB store (InquireNotes.putImage / putFile), so backups carry them.
   Reminders: the page works out what is coming up and hands it to the desktop main process (inquireDesktop.tasks.schedule),
   which shows system notifications even while the window is closed (macOS keeps NotePath running); a click opens the task.
   Without the desktop bridge (browser preview, tests) the page checks every 20 s itself. Fired reminders are remembered
   ("notepath.tasks.fired") so each one shows once. */
(function () {
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s, r) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const KEY = "notepath.tasks._local", FKEY = "notepath.tasks.fired";
const NS = () => window.InquireNotes;
const changed = () => { window.dispatchEvent(new CustomEvent("np:tasks-changed")); schedule(); };

const PRI = { high: { name: "High", glyph: "▲", col: "#E5675B", rank: 0 }, med: { name: "Medium", glyph: "◆", col: "#F2B84B", rank: 1 }, low: { name: "Low", glyph: "●", col: "#5CC8E0", rank: 2 } };
const REM = [[0, "At the due time"], [10, "10 minutes before"], [60, "1 hour before"], [1440, "1 day before"]];
const REPEAT = [["none", "Doesn't repeat"], ["daily", "Every day"], ["weekly", "Every week"]];

/* ---------- store ---------- */
const norm = t => Object.assign({ title: "Untitled task", done: false, doneAt: null, pri: "med", dueDate: "", dueTime: "", repeat: "none", rem: [], loc: null, notes: "", files: [], pic: null, last: null }, t,
  { pri: PRI[t.pri] ? t.pri : "med", rem: Array.isArray(t.rem) ? t.rem.filter(x => Number.isFinite(+x) && +x >= 0).map(Number) : [], files: Array.isArray(t.files) ? t.files : [] });
const read = () => { try { const v = JSON.parse(localStorage.getItem(KEY) || "[]"); return Array.isArray(v) ? v.filter(x => x && x.id).map(norm) : []; } catch (e) { return []; } };
const write = all => { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { console.warn("Tasks could not be saved", e); } changed(); };
const all = () => read();
const get = id => read().find(t => t.id === id) || null;
function create(o = {}) { const now = Date.now(), t = norm(Object.assign({ id: uid(), created: now, updated: now }, o)); const a = read(); a.push(t); write(a); return t; }
function update(id, patch) { const a = read(), t = a.find(x => x.id === id); if (!t) return null; Object.assign(t, patch, { updated: Date.now() }); const n = norm(t); a.splice(a.indexOf(t), 1, n); write(a); return n; }
function remove(id) { const a = read(), t = a.find(x => x.id === id); if (!t) return null; write(a.filter(x => x !== t)); return t; }
const mediaOf = t => [t.pic, ...(t.files || []).map(f => f.id)].filter(Boolean);
function purge(t) { // a deleted task's picture and files, unless another task still uses them
  const still = new Set(read().flatMap(mediaOf)), gone = mediaOf(t).filter(i => !still.has(i));
  if (gone.length && NS() && NS().delMedia) NS().delMedia(gone);
}

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parse = (date, time) => { if (!date) return null; const [y, m, d] = date.split("-").map(Number), [hh, mm] = (time || "23:59").split(":").map(Number); const x = new Date(y, m - 1, d, hh, mm, 0, 0); return isNaN(x) ? null : x; };
const dueAt = t => parse(t.dueDate, t.dueTime);               // when it is due (end of the day without a time)
const remBase = t => parse(t.dueDate, t.dueTime || "09:00");   // reminders count back from the time, or 9:00 on that day
function dueLabel(t, long) {
  const d = dueAt(t); if (!d) return "";
  const today = new Date(), tm = new Date(); tm.setDate(tm.getDate() + 1); const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const day = ymd(d) === ymd(today) ? "Today" : ymd(d) === ymd(tm) ? "Tomorrow" : ymd(d) === ymd(yd) ? "Yesterday"
    : d.toLocaleDateString([], { weekday: long ? "long" : "short", month: "short", day: "numeric", year: d.getFullYear() === today.getFullYear() ? undefined : "numeric" });
  return t.dueTime ? day + ", " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : day;
}
const overdue = t => { const d = dueAt(t); return !t.done && d && d.getTime() < Date.now(); };
const soon = t => { const d = dueAt(t); return !t.done && d && !overdue(t) && d.getTime() - Date.now() < 24 * 3600e3; };
function remLabel(m) { const r = REM.find(x => x[0] === m); if (r) return r[1]; return m % 1440 === 0 ? `${m / 1440} day${m === 1440 ? "" : "s"} before` : m % 60 === 0 ? `${m / 60} hour${m === 60 ? "" : "s"} before` : `${m} minutes before`; }
// a repeating task ticked done: its next date (always in the future), still open
function nextDue(t) {
  const step = t.repeat === "weekly" ? 7 : 1, d = parse(t.dueDate || ymd(new Date()), "12:00");
  const today = ymd(new Date());
  do { d.setDate(d.getDate() + step); } while (ymd(d) <= today && t.dueDate);
  if (!t.dueDate) { const x = new Date(); x.setDate(x.getDate() + step); return ymd(x); }
  return ymd(d);
}
function setDone(id, on) {
  const t = get(id); if (!t) return null;
  if (on && t.repeat !== "none") return update(id, { dueDate: nextDue(t), last: Date.now(), done: false, doneAt: null });
  return update(id, { done: !!on, doneAt: on ? Date.now() : null });
}

/* ---------- reminders ---------- */
const fired = () => { try { return new Set(JSON.parse(localStorage.getItem(FKEY) || "[]")); } catch (e) { return new Set(); } };
const markFired = k => { const s = [...fired()]; if (!s.includes(k)) { s.push(k); try { localStorage.setItem(FKEY, JSON.stringify(s.slice(-600))); } catch (e) {} } };
// every reminder still to show: { key, id, at (ms), title, body } (one missed in the last 6 hours still shows once)
function upcoming() {
  const now = Date.now(), done = fired(), out = [];
  read().forEach(t => {
    if (t.done || !t.dueDate || !t.rem.length) return;
    const base = remBase(t); if (!base) return;
    t.rem.forEach(m => {
      const at = base.getTime() - m * 60000, key = `${t.id}|${t.dueDate}T${t.dueTime}|${m}`;
      if (done.has(key) || at < now - 6 * 3600e3) return;
      out.push({ key, id: t.id, at, title: (m === 0 ? "Due now: " : "Coming up: ") + t.title,
        body: [dueLabel(t, true), PRI[t.pri].name + " priority", t.loc ? t.loc.label.split(",")[0] : ""].filter(Boolean).join(" · ") });
    });
  });
  return out.sort((a, b) => a.at - b.at);
}
const D = () => window.inquireDesktop && window.inquireDesktop.tasks;
let tick = 0;
function schedule() {
  if (D()) { try { D().schedule(upcoming()); } catch (e) {} return; }
  clearInterval(tick); tick = setInterval(check, 20000); setTimeout(check, 300);
}
function check() { const now = Date.now(); upcoming().filter(r => r.at <= now).forEach(r => { markFired(r.key); notify(r, true); }); }
// a reminder showing: a system notification (browser only: the desktop shows its own) and a message in the app
function notify(r, sys) {
  if (sys && "Notification" in window) {
    const show = () => { try { const n = new Notification(r.title, { body: r.body, tag: r.key }); n.onclick = () => { window.focus(); openTask(r.id); }; } catch (e) {} };
    if (Notification.permission === "granted") show(); else if (Notification.permission !== "denied") Notification.requestPermission().then(p => { if (p === "granted") show(); });
  }
  if (NS() && NS().toast) NS().toast(`<b>◷ ${esc(r.title)}</b>${r.body ? " · " + esc(r.body) : ""}`, { label: "Open", run: () => openTask(r.id) }, 12000);
  window.dispatchEvent(new CustomEvent("np:task-reminder", { detail: r }));
}
const openTask = id => { if (window.InquireApp) InquireApp.go({ view: "tasks", sel: id }); };
if (D()) {
  try { D().onFired(r => { markFired(r.key); notify(r, false); }); D().onOpen(id => openTask(id)); } catch (e) {}
  try { D().fired().then(keys => { (keys || []).forEach(markFired); schedule(); }); } catch (e) { schedule(); }
} else schedule();

/* ---------- places: OpenStreetMap (Nominatim to check an address, map tiles to show it) ---------- */
async function geocode(q) {
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=0&limit=5&q=" + encodeURIComponent(q);
  let body = null;
  if (window.inquireDesktop && inquireDesktop.lookupWord) { const r = await inquireDesktop.lookupWord({ url }); if (r.status !== 200) throw new Error(r.status ? "The map service answered " + r.status : "No connection to the map service"); body = r.body; }
  else { const r = await fetch(url, { headers: { Accept: "application/json" } }); if (!r.ok) throw new Error("The map service answered " + r.status); body = await r.json(); }
  return (Array.isArray(body) ? body : []).map(x => ({ label: String(x.display_name || ""), lat: +x.lat, lon: +x.lon })).filter(x => x.label && isFinite(x.lat) && isFinite(x.lon));
}
// a small map: OpenStreetMap tiles around the place, a pin in the middle, − / ＋ zoom (no library needed)
function mapView(host, loc) {
  let z = 16;
  host.innerHTML = `<div class="nt-tiles"></div><span class="nt-pin" aria-hidden="true"></span><div class="nt-zoom"><button type="button" data-z="1" aria-label="Zoom in">＋</button><button type="button" data-z="-1" aria-label="Zoom out">−</button></div><span class="nt-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</span>`;
  const tiles = $(".nt-tiles", host);
  const draw = () => {
    const W = host.clientWidth || 400, H = host.clientHeight || 200, n = 2 ** z, lat = loc.lat * Math.PI / 180;
    const cx = (loc.lon + 180) / 360 * 256 * n, cy = (1 - Math.log(Math.tan(lat) + 1 / Math.cos(lat)) / Math.PI) / 2 * 256 * n;
    const x0 = Math.floor((cx - W / 2) / 256), x1 = Math.floor((cx + W / 2) / 256), y0 = Math.floor((cy - H / 2) / 256), y1 = Math.floor((cy + H / 2) / 256);
    let html = "";
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      if (y < 0 || y >= n) continue; const wx = ((x % n) + n) % n;
      html += `<img alt="" draggable="false" src="https://tile.openstreetmap.org/${z}/${wx}/${y}.png" style="left:${Math.round(x * 256 - cx + W / 2)}px;top:${Math.round(y * 256 - cy + H / 2)}px">`;
    }
    tiles.innerHTML = html;
  };
  host.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { z = Math.max(3, Math.min(19, z + +b.dataset.z)); draw(); });
  const ro = window.ResizeObserver ? new ResizeObserver(draw) : null; if (ro) ro.observe(host);
  draw();
  return { destroy: () => { if (ro) ro.disconnect(); } };
}

/* ---------- .ics (add one task to any calendar app) ---------- */
function ics(t) {
  const d = dueAt(t); if (!d) return null;
  const f = x => x.getUTCFullYear() + pad(x.getUTCMonth() + 1) + pad(x.getUTCDate()) + "T" + pad(x.getUTCHours()) + pad(x.getUTCMinutes()) + "00Z";
  const e = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const start = t.dueTime ? d : null, day = t.dueDate.replace(/-/g, "");
  const end = t.dueTime ? new Date(d.getTime() + 30 * 60000) : null, nd = parse(t.dueDate, "12:00"); nd.setDate(nd.getDate() + 1);
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Wolfie's Coven//NotePath//EN", "BEGIN:VEVENT", "UID:" + t.id + "@notepath", "DTSTAMP:" + f(new Date()),
    start ? "DTSTART:" + f(start) : "DTSTART;VALUE=DATE:" + day, end ? "DTEND:" + f(end) : "DTEND;VALUE=DATE:" + ymd(nd).replace(/-/g, ""),
    "SUMMARY:" + e(t.title), t.notes ? "DESCRIPTION:" + e(t.notes) : "", t.loc ? "LOCATION:" + e(t.loc.label) : "", t.loc ? `GEO:${t.loc.lat};${t.loc.lon}` : "",
    t.repeat === "daily" ? "RRULE:FREQ=DAILY" : t.repeat === "weekly" ? "RRULE:FREQ=WEEKLY" : "", "PRIORITY:" + (t.pri === "high" ? 1 : t.pri === "med" ? 5 : 9),
    ...t.rem.map(m => `BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(t.title)}\r\nTRIGGER:-PT${m}M\r\nEND:VALARM`), "END:VEVENT", "END:VCALENDAR"].filter(Boolean);
  return L.join("\r\n") + "\r\n";
}
function download(blob, name) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

/* ---------- the page ---------- */
const store = { get(k, d) { try { const v = localStorage.getItem("notepath." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("notepath." + k, JSON.stringify(v)); } catch (e) {} } };
const ST = { sel: null, q: "", sort: store.get("tasksort", "due"), showDone: store.get("taskdone", true) };
const sorters = {
  due: (a, b) => (a.done - b.done) || ((dueAt(a) ? dueAt(a).getTime() : 9e15) - (dueAt(b) ? dueAt(b).getTime() : 9e15)) || (PRI[a.pri].rank - PRI[b.pri].rank) || (b.created - a.created),
  pri: (a, b) => (a.done - b.done) || (PRI[a.pri].rank - PRI[b.pri].rank) || ((dueAt(a) ? dueAt(a).getTime() : 9e15) - (dueAt(b) ? dueAt(b).getTime() : 9e15)) || (b.created - a.created),
  new: (a, b) => (a.done - b.done) || (b.created - a.created) };
const priIcon = (p, cls) => `<i class="nt-pri ${cls || ""}" data-pri="${p}" title="${PRI[p].name} priority" aria-label="${PRI[p].name} priority">${PRI[p].glyph}</i>`;
const imgURL = id => (NS() && id ? NS().imageURL(id) : Promise.resolve(null));
function hydratePics(root) { root.querySelectorAll("[data-pic]").forEach(el => imgURL(el.dataset.pic).then(u => { if (u) el.style.backgroundImage = `url("${u}")`; })); }

function render(m, o = {}) {
  if (o.sel) ST.sel = o.sel;
  const s = m.body;
  s.innerHTML = `<div class="nt">
    <aside class="nt-list nb-list"><div class="nb-tools"><label class="search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search tasks" aria-label="Search tasks"></label></div>
      <div class="nb-filter"><select class="nt-sort" aria-label="Order of tasks"><option value="due">By due date</option><option value="pri">By priority</option><option value="new">Newest first</option></select><button type="button" class="nb-favtop nt-showdone" aria-pressed="false">✓ Done</button></div>
      <div class="nt-sum num"></div><div class="nb-items nt-items" role="listbox" aria-label="Tasks"></div></aside>
    <section class="nt-ed" aria-label="Task"></section></div>`;
  m.head.innerHTML = `<span class="mw-tip" tabindex="0" title="Tick a task to finish it (a repeating task moves to its next date). Give it a priority, a due date and reminders: NotePath shows a notification when one comes up. Check a place to pin it on a map. Drop photos, videos or any file on the task, and give it a picture of its own." aria-label="Tips">?</span><button type="button" class="np-newb" data-a="newtask" title="Name a new task and choose its priority (Alt+Shift+N)">＋ New Task</button>`;
  const items = $(".nt-items", s), ed = $(".nt-ed", s), q = $('input[type="search"]', s), sortSel = $(".nt-sort", s), sd = $(".nt-showdone", s), sum = $(".nt-sum", s);
  q.value = ST.q; q.oninput = () => { ST.q = q.value; drawList(); };
  sortSel.value = ST.sort; sortSel.onchange = () => { ST.sort = sortSel.value; store.set("tasksort", ST.sort); drawList(); };
  const paintSD = () => { sd.setAttribute("aria-pressed", String(!!ST.showDone)); sd.title = ST.showDone ? "Finished tasks are shown (at the bottom). Click to hide them" : "Finished tasks are hidden. Click to show them"; };
  sd.onclick = () => { ST.showDone = !ST.showDone; store.set("taskdone", ST.showDone); paintSD(); drawList(); }; paintSD();
  $('[data-a="newtask"]', m.head).onclick = () => newTask();
  m.newNote = () => newTask();

  async function newTask() {
    flush();
    const r = await InquireApp.askText({ title: "New task", label: "Task", placeholder: "What needs doing?", ok: "Create task", max: 140, kind: "med",
      kinds: ["high", "med", "low"].map(k => ({ k, glyph: `<span class="nt-pri" data-pri="${k}">${PRI[k].glyph}</span>`, name: PRI[k].name + " priority", desc: k === "high" ? "Urgent or important" : k === "med" ? "Soon, when you can" : "Some day, no rush", placeholder: "What needs doing?" })) });
    if (r == null) return;
    const t = create({ title: r.text || "Untitled task", pri: r.kind || "med" });
    ST.sel = t.id; ST.q = ""; q.value = ""; drawAll();
  }

  function visible() {
    const qq = ST.q.trim().toLowerCase();
    return read().filter(t => (ST.showDone || !t.done) && (!qq || (t.title + "\n" + t.notes + "\n" + (t.loc ? t.loc.label : "")).toLowerCase().includes(qq))).sort(sorters[ST.sort] || sorters.due);
  }
  function drawList() {
    const list = visible(), every = read();
    if (!ST.sel || !every.some(t => t.id === ST.sel)) ST.sel = list[0] ? list[0].id : null;
    const open = every.filter(t => !t.done).length, od = every.filter(overdue).length;
    sum.innerHTML = every.length ? `${open} open${od ? ` · <b class="nt-od">${od} overdue</b>` : ""}${every.length - open ? ` · ${every.length - open} done` : ""}` : "";
    items.innerHTML = list.length ? list.map(t => `<div role="option" tabindex="0" class="nb-it nt-it${t.done ? " done" : ""}" data-id="${t.id}" data-pri="${t.pri}" aria-selected="${t.id === ST.sel}">
        <button type="button" class="nt-ck" role="checkbox" aria-checked="${t.done}" aria-label="${t.done ? "Mark not done" : "Mark done"}: ${esc(t.title)}" title="${t.repeat !== "none" ? "Done (it comes back " + (t.repeat === "daily" ? "tomorrow" : "next week") + ")" : t.done ? "Not done yet" : "Done"}"></button>
        ${t.pic ? `<span class="nt-thumb" data-pic="${t.pic}" aria-hidden="true"></span>` : ""}
        <span class="nt-itx"><span class="nb-t">${priIcon(t.pri)}${esc(t.title)}</span>

    };
  }
  function lightbox(f) {
    imgURL(f.id).then(u => {
      if (!u) return;
      const ov = document.createElement("div"); ov.className = "np-pop nt-lb"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-label", f.name);
      ov.innerHTML = /^video\//.test(f.type) ? `<video src="${u}" controls autoplay></video>` : `<img src="${u}" alt="${esc(f.name)}">`;
      ov.insertAdjacentHTML("beforeend", `<button type="button" class="nt-lbx" aria-label="Close">✕</button><span class="nt-lbn">${esc(f.name)}</span>`);
      document.body.appendChild(ov);

      const key = e => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); } };
      document.addEventListener("keydown", key, true); ov.onclick = e => { if (e.target === ov || e.target.closest(".nt-lbx")) close(); };

  const onChange = () => { if (!saveT) drawList(); };

  const clock = setInterval(() => { if (!saveT && !(document.activeElement && document.activeElement.closest && document.activeElement.closest(".nt-ed"))) drawList(); }, 60000); // "Overdue" appears on time
  m.cleanup.push(() => { flush(); window.removeEventListener("np:tasks-changed", onChange); clearInterval(clock); if (mapV) mapV.destroy(); document.querySelectorAll(".nt-lb").forEach(x => x.remove()); });
  m.redraw = drawAll; m.show = x => { if (x.sel) { flush(); ST.sel = x.sel; } drawAll(); };

window.NPTasks = { all, get, create, update, remove, setDone, render, upcoming, dueAt, dueLabel, overdue, nextDue, ics, PRI, REM, geocode,
  media: () => read().flatMap(mediaOf), readRaw: read, writeRaw: write, openCount: () => read().filter(t => !t.done).length, overdueCount: () => read().filter(overdue).length };
})();

<script>/* web/src/io.js */
/* Import & export for My notes (NotePath, Oct 2026): window.NPIO.
   Export one note, a folder (with its subfolders) or everything, as:
     Markdown / Obsidian (.md; several notes → a .zip that keeps the folders, [[links]] between notes, photos in attachments/),
     Word (.docx: Microsoft Word, Google Docs, Pages, OneNote's Insert › File), Evernote / Apple Notes (.enex: Apple Notes
     File › Import to Notes, Evernote, Joplin), web page (.html), PDF and plain text (.txt). Several notes in a format that
     holds one note per file → a .zip with the same folders.
   Import files, a .zip or a whole folder (an Obsidian vault): .md / .markdown, .txt, .html / .htm (Google Docs, Notion),
   .docx (Word, Google Docs), .enex (Evernote, Apple Notes exports), Google Keep (Takeout .json), Notion exports (.zip of
   .md, ids stripped from names). The folder structure is kept: folders are made under the folder chosen.
   No libraries: a small zip reader / writer (the browser's own deflate), md5 for .enex, and converters both ways.
   Every format goes through one simple form of a note (blocks of runs: ir()), so the exporters agree with each other. */
(function () {
"use strict";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const xesc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
const $ = (s, r) => r.querySelector(s);
const NS = () => window.InquireNotes;
const enc = new TextEncoder(), dec = new TextDecoder();

/* ---------- zip (store + deflate via CompressionStream; read via DecompressionStream) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function pipe(bytes, stream) { const r = new Response(new Blob([bytes]).stream().pipeThrough(stream)); return new Uint8Array(await r.arrayBuffer()); }
const deflate = b => pipe(b, new CompressionStream("deflate-raw")), inflate = b => pipe(b, new DecompressionStream("deflate-raw"));
const toBytes = d => typeof d === "string" ? enc.encode(d) : d instanceof Uint8Array ? d : new Uint8Array(d);
// entries: [{ name, data: string | Uint8Array }] → Blob (application/zip)
async function zip(entries) {
  const parts = [], central = []; let off = 0;
  const now = new Date(), dtime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1), ddate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const e of entries) {
    const name = enc.encode(e.name), raw = toBytes(e.data), crc = crc32(raw);
    let body = raw, method = 0;
    if (raw.length > 64 && !/\.(png|jpe?g|gif|webp|zip|docx|mp4|mov|webm)$/i.test(e.name)) { const d = await deflate(raw); if (d.length < raw.length) { body = d; method = 8; } }
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, method, true); h.setUint16(10, dtime, true); h.setUint16(12, ddate, true);
    h.setUint32(14, crc, true); h.setUint32(18, body.length, true); h.setUint32(22, raw.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);

// a dropped folder: walk it (webkitGetAsEntry) so its structure is kept
async function droppedFiles(dt) {

  if (!ents.some(x => x.isDirectory)) return [...dt.files];
  const out = [];
  const walk = async (en, path) => {
    if (en.isFile) { const f = await new Promise((res, rej) => en.file(res, rej)); f.relPath = path + en.name; out.push(f); return; }
    const rd = en.createReader(); let batch;

  };
  for (const en of ents) await walk(en, "");
  return out;
}
