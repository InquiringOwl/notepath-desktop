# Runs on every push to main and every pull request (and before each release, see release.yml).
# 0. npm ci          - the packages (Monaco for the Code tab); --ignore-scripts skips Electron's download
# 1. build-web.js  - every source file must parse; builds app/index.html (and copies Monaco into app/vendor)
# 2. unit.js       - identity (name, app id, repo, scheme, storage keys) and helper rules, no browser
# 3. smoke.js      - headless Chromium opens every screen and window at desktop and phone width; any JS error fails
# 4. interact.js   - drives the notes features (folders, order, lists, checklists, widgets, right-click, backups, shortcuts)
name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Install packages (the Code tab's editor, Monaco, comes from here; no Electron download)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tools/build-web.js
      - run: node tools/unit.js
      - name: Install the test browser (for the Playwright version in package-lock.json)
        run: npx playwright install --with-deps chromium
      - run: node tools/smoke.js
      - run: node tools/interact.js
