# Builds NotePath for macOS, Windows and Linux and publishes a GitHub Release in this repo.
# Installed copies of NotePath find that release and update themselves.
# Trigger: push a tag like v1.0.1   (git tag v1.0.1 && git push origin v1.0.1)
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Same checks as every push (validator + smoke test). A failing check stops the release,
  # so a broken build never reaches installed copies through auto-update.
  check:
    uses: ./.github/workflows/check.yml
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'   # dev-only test tool; not needed to build the app
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node tools/build-web.js
      # macOS signing + notarisation, used only once Apple secrets exist.
      - name: Use Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        shell: bash
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CERT_P12_BASE64 }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
      - name: Build unsigned (no Apple certificate yet)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT != 'true'
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      # One retry: a dropped upload to GitHub once left v1.16.1 without latest-mac.yml (Macs could not update until a re-run).
      - name: Build and publish
        shell: bash
        run: npx electron-builder --publish always || { echo "::warning::Build/upload failed, retrying once in 30 s"; sleep 30; npx electron-builder --publish always; }
